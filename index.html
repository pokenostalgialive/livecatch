<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Catch HOME</title>
<meta name="theme-color" content="#16a99e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e3f5f3; --bg2:#dde8fb; --card:#ffffff; --ink:#1d2a3a; --mute:#6c7a8c; --line:#e3e9f0;
  --teal:#16a99e; --blue:#2f6fe0; --gold:#e8a917; --pink:#e5587e; --violet:#7a5cf0;
  --box1:#79d6c8; --box2:#6aa9ec; --slot:rgba(255,255,255,.55); --slotE:rgba(255,255,255,.22);
  --r:18px; --shadow:0 6px 22px rgba(30,60,100,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;font-size:18px}
.logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--teal),var(--blue),var(--teal));position:relative;flex:none}
.logo i:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.logo small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:0}
.upd{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700;text-align:right}
.upd b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:5px;vertical-align:1px}
.tabs{display:flex;gap:4px}
.tabs a{font-weight:800;font-size:14px;color:var(--mute);text-decoration:none;padding:8px 14px;border-radius:999px}
.tabs a.on{background:var(--ink);color:#fff}
.dtabs{display:none}
.btabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.btabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-weight:800;font-size:12px;padding:6px 0;border-radius:14px}
.btabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.btabs a.on{color:var(--teal)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2{font-size:15px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:22px 4px 10px}
h2:first-child{margin-top:4px}
/* search */
.hero{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:22px;padding:20px 16px 18px;box-shadow:var(--shadow);position:relative;z-index:6}
.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at calc(100% + 0px) 0,transparent 74px,rgba(255,255,255,.12) 75px,rgba(255,255,255,.12) 100px,transparent 101px)}
.hero h1{font-size:23px;font-weight:900;line-height:1.15;position:relative}
.hero p{opacity:.9;font-weight:700;font-size:14px;margin-top:4px;position:relative}
.search{position:relative;margin-top:14px}
.search input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px 16px 14px 46px;border-radius:16px;border:0;outline:0;color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:60vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:5;color:var(--ink)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;font-weight:800}
.sugg button:not(:last-child){border-bottom:1px solid var(--line)}
.sugg small{margin-left:auto;color:var(--mute);font-weight:700}
.sugg .none{padding:14px;color:var(--mute);font-weight:700}
/* stats strip */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.today div{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.today b{display:block;font-size:22px;font-weight:900}
.today span{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
/* hall of fame */
.hof{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hofc{border-radius:var(--r);padding:12px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:center;cursor:pointer}
.hofc.sh{background:linear-gradient(150deg,#ffb84d,#e5587e)}
.hofc.lg{background:linear-gradient(150deg,#7a5cf0,#2f6fe0)}
.hofc .lab{font-size:11px;font-weight:900;letter-spacing:1px;opacity:.95}
.hofc img{width:104px;height:104px;margin:4px auto 2px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));object-fit:contain}
.hofc .nm{font-weight:900;font-size:16px}
.hofc .by{font-size:12px;font-weight:700;opacity:.95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* list rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.row:not(:last-child){border-bottom:1px solid var(--line)}
.row:active{background:#f4f8fb}
.pos{width:26px;text-align:center;font-weight:900;color:var(--mute);flex:none}
.pos.p1,.pos.p2,.pos.p3{color:#fff;border-radius:50%;height:26px;line-height:26px;font-size:13px}
.pos.p1{background:#e8b923}.pos.p2{background:#a9b4c2}.pos.p3{background:#cd8a52}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-weight:900;font-size:17px;text-align:right}
.val small{display:block;font-size:10px;color:var(--mute);font-weight:800;text-transform:uppercase}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:#dfe7ef;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--mute);box-shadow:0 2px 8px rgba(30,60,100,.08)}
.chip.on{background:var(--ink);color:#fff}
/* trainer */
.tgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tgrid>div,.homeg>div{min-width:0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--teal)}
.prof h1{font-size:22px;font-weight:900;line-height:1.1;word-break:break-all}
.ttl{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:#fde7ee;color:var(--pink);font-size:11px;font-weight:900;letter-spacing:.5px}
.meta{font-size:13px;color:var(--mute);font-weight:800;margin-top:6px}
.meta span+span:before{content:" · "}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#f3f7fa;border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:10px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.stat.s b{color:var(--gold)}.stat.l b{color:var(--violet)}
.team{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm{aspect-ratio:1;background:#f3f7fa;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer}
.tm img{width:86%;height:86%;object-fit:contain}
.tm.e{background:repeating-linear-gradient(45deg,#f3f7fa,#f3f7fa 6px,#edf2f6 6px,#edf2f6 12px);cursor:default}
.empty{color:var(--mute);font-weight:700;font-size:13px;margin-top:8px}
.regs{display:grid;gap:8px}
.reg{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:13px;font-weight:900}
.bar{height:10px;background:#edf2f6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.reg.done .bar i{background:linear-gradient(90deg,#f2c230,#e8a917)}
.reg em{font-style:normal;text-align:right;color:var(--mute);font-weight:800;font-size:12px}
.reg.done em{color:var(--gold)}
/* box */
.box{border-radius:22px;padding:12px;background:linear-gradient(160deg,var(--box1),var(--box2));box-shadow:var(--shadow)}
.boxh{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px}
.boxh b{font-weight:900;letter-spacing:.8px;font-size:16px;background:rgba(255,255,255,.22);padding:6px 16px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.boxh button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center}
.boxh button:disabled{opacity:.35}
.boxh svg{width:20px;height:20px;color:#fff}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:14px;background:var(--slot);position:relative;display:grid;place-items:center;cursor:pointer}
.slot img{width:92%;height:92%;object-fit:contain}
.slot.shy{background:linear-gradient(150deg,rgba(255,236,170,.95),rgba(255,206,120,.75));box-shadow:inset 0 0 0 2px rgba(255,200,60,.9)}
.slot.mg{box-shadow:inset 0 0 0 2px #ff6fb5}
.slot.shy.mg{box-shadow:inset 0 0 0 2px #ff6fb5,inset 0 0 0 4px rgba(255,200,60,.9)}
.mgl{position:absolute;right:3px;top:3px;font-size:7.5px;font-weight:900;letter-spacing:.3px;background:#ff4fa3;color:#fff;border-radius:6px;padding:1px 4px;line-height:11px}
.slot.e{background:var(--slotE);cursor:default}
.slot.miss{background:var(--slotE)}
.slot.miss span{color:rgba(255,255,255,.85);font-size:10px;font-weight:900}
.slot.miss img{filter:brightness(0) opacity(.18)}
.cnt{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:900;background:#fff;color:var(--ink);border-radius:99px;padding:0 5px;line-height:15px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.star{position:absolute;left:4px;top:2px;font-size:13px;color:#ffcf3a;text-shadow:0 0 3px rgba(150,90,0,.8)}
.boxf{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.boxf i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.boxf i.on{background:#fff}
.boxnote{color:#fff;font-weight:800;font-size:13px;text-align:center;padding:30px 0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#d8e0e8;margin:0 auto 10px}
.sheet .big{width:180px;height:180px;margin:0 auto;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.sheet .no{font-weight:900;color:var(--mute);font-size:13px}
.sheet h3{font-size:24px;font-weight:900}
.types{display:flex;gap:6px;justify-content:center;margin:8px 0}
.type{padding:3px 12px;border-radius:99px;color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.6px;margin-top:4px}
.tag.mega{background:linear-gradient(90deg,#ffe0f0,#e6e0ff);color:#b0308a}.tag.legend{background:#ece6ff;color:var(--violet)}.tag.rare{background:#e3f0ff;color:var(--blue)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tog{margin-top:12px;font-weight:900;font-size:13px;padding:9px 16px;border-radius:99px;background:#fff6dc;color:#9b6c00}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.back{text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--mute);margin-bottom:10px;font-size:14px}
.back svg{width:18px;height:18px}
.foot{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin:26px 0 8px}

/* phase 2 */
.pcard{position:relative}
.partner{position:absolute;right:10px;top:8px;width:84px;height:84px;cursor:pointer}
.partner img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.prof.hasp{padding-right:80px}
.prof.hasp h1{font-size:20px}
.acts{margin-top:12px;display:flex;gap:8px}
.btn{flex:1;font-weight:900;font-size:15px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;box-shadow:0 4px 12px rgba(47,111,224,.25)}
.btn.ghost{background:#f1f5f9;color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.6}
.wish{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm.want img{opacity:.95}
.sheet .sub{color:var(--mute);font-weight:700;font-size:14px;margin:4px 0 10px}
.sheet h3+.sub b{color:var(--ink)}
.code{font-size:34px;font-weight:900;letter-spacing:2px;background:#f1f7f6;border:2px dashed var(--teal);border-radius:16px;padding:14px;margin:6px 0 12px;color:var(--ink)}
.status{font-weight:800;font-size:14px;color:var(--teal);display:flex;align-items:center;justify-content:center;gap:8px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid #cdeee9;border-top-color:var(--teal);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{font-size:12px;font-weight:700;color:#b5612a;background:#fff4ea;border-radius:12px;padding:8px 10px;margin:12px 0}
.sheet.edit{max-height:92vh;overflow:auto;text-align:center;padding-bottom:0}
.chips.ctr{justify-content:center;flex-wrap:wrap}
.chip:disabled{opacity:.4}
.hint{font-size:12px;font-weight:700;color:var(--mute);margin:6px 0;text-align:center}
.sheet .team,.sheet .wish{margin-top:6px}
.tm.rm,.pbig .rm{cursor:pointer}
.pbig{height:110px;display:grid;place-items:center;color:var(--mute);font-weight:800}
.pbig img{width:110px;height:110px;object-fit:contain}
.search.sm{margin:8px 0}
.search.sm input{font-size:15px;padding:11px 14px 11px 42px;box-shadow:none;background:#f1f5f9}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:38vh;overflow:auto;padding:2px}
.slot.pk{background:#f3f7fa;flex-direction:column;display:flex;align-items:center;justify-content:center;padding:4px 2px;aspect-ratio:auto}
.slot.pk img{width:56px;height:56px}
.slot.pk span{font-size:10px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.pk.sel{background:#dff5f1;box-shadow:inset 0 0 0 2px var(--teal)}
.savebar{position:sticky;bottom:0;background:#fff;display:flex;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:10px;border-top:1px solid var(--line)}
.sw{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#f3f7fa;border-radius:16px;padding:14px;cursor:pointer;margin-top:8px}
.sw input{display:none}
.sw>span{flex:none;width:46px;height:28px;border-radius:99px;background:#cfd8e2;position:relative;transition:.2s}
.sw>span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--teal)}
.sw input:checked+span:after{left:21px}
.sw b{display:block;font-weight:900}
.sw small{display:block;color:var(--mute);font-weight:700;font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:12px 18px;border-radius:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s;max-width:90vw;text-align:center}
.mepill{display:inline-block;margin-left:8px;background:#e3f6f3;color:var(--teal);font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px;text-decoration:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.foot a{color:var(--mute);font-weight:800}
.legal h1{font-size:24px;font-weight:900}
.legal h4{margin:16px 0 4px;font-weight:900;font-size:15px}
.legal p{font-size:14px;font-weight:600;line-height:1.5;color:#3a4757}
@media(max-width:420px){.upd{font-size:11px}.mepill{display:block;margin:3px 0 0 auto;max-width:120px}}
@media(min-width:860px){.toast{bottom:30px}}
/* desktop */
@media(min-width:860px){
  body{padding-bottom:0}
  .btabs{display:none}
  .dtabs{display:flex;margin-left:24px}
  .upd{margin-left:auto}
  main{padding:24px 16px}
  .homeg{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .tgrid{grid-template-columns:400px minmax(0,1fr);align-items:start}
  .tgrid .side{position:sticky;top:80px}
  .hero{padding:30px 26px 26px}.hero h1{font-size:30px}
  .slots{gap:8px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px}
  .rankg{max-width:720px;margin:0 auto}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/" style="text-decoration:none;color:inherit"><i></i><div>LIVE CATCH HOME<small>Your Pokémon from the live</small></div></a>
  <nav class="tabs dtabs" id="dtabs"></nav>
  <div class="upd" id="upd"></div>
</div></header>
<main id="app"></main>
<nav class="btabs" id="btabs"></nav>

<script src="meta.js"></script>
<script src="demo_data.js"></script>
<script>
/* ===== CONFIG =====
   Default: live data from Supabase (sent by the game every 5 min).
   Add ?demo to the address to see the fake demo data. */
const CONFIG = { SOURCE: /[?&]demo/.test(location.search) ? 'demo' : 'supabase', REFRESH_MIN: 5,
  CONTACT: 'a private message to the host of the live on TikTok',
  SB_URL: 'https://pdkxuxpvglrupzacpjdg.supabase.co',
  SB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBka3h1eHB2Z2xydXB6YWNwamRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjM4MTMsImV4cCI6MjEwODMzOTgxM30.sBaf9mCEu_0pgSWIo7qhaSJtmhWxtPvNHC5THXangAw' };

const M = window.META, LEG = new Set(M.leg), RARE = new Set(M.rare), UB = new Set(M.ub), PARALEG = new Set(M.paraleg), PARADOX = new Set(M.paradox), EVENT = new Set(M.event);
const IDS = Object.keys(M.n).map(Number).sort((a, b) => a - b);
const REGIONS = M.reg.map(([n, a, b]) => ({n, ids: IDS.filter(id => id >= a && id <= b && !EVENT.has(id))}));
const MEGA = M.mega || {}, MEGAIDS = Object.keys(MEGA).map(Number).sort((a, b) => a - b);      // Live Catch ids 1101-1150 -> [name, base, types, pokeapi id]
const isMega = id => !!MEGA[id], pid = id => MEGA[id] ? MEGA[id][3] : id;
const name = id => M.n[id] || (MEGA[id] && MEGA[id][0]) || ('#' + id);
const pad = id => '#' + String(id).padStart(4, '0');
const SPR = 'https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/';

let D = null, T = [], BY = {};
function build(data){
  D = data; const dex = data.dex || {}, av = data.av || {}, wk = (data.week || {}).n || {};
  T = Object.entries(dex).map(([u, d]) => {
    const c = d.c || {}, own = Object.keys(c).filter(k => c[k] > 0 && M.n[k]).map(Number), mega = Object.keys(c).filter(k => c[k] > 0 && MEGA[k]).map(Number).sort((a, b) => a - b);
    return {u, n: d.n || 0, s: d.s || 0, c, sc: d.sc || {}, sh: (d.sh || []).map(Number), own, mega, mg: mega.length, dex: own.length, leg: own.filter(id => LEG.has(id)).length,
      team: (d.team || []).filter(id => M.n[id] || MEGA[id]), st: d.st || 0, last: d.last, title: d.title || null, badges: d.badges || [], av: av[u] || null, wk: wk[u] || 0};
  });
  BY = {}; for (const t of T) BY[t.u.toLowerCase()] = t;
  const r = [...T].sort((a, b) => b.n - a.n); r.forEach((t, i) => t.rank = i + 1);
}
async function load(){
  if (CONFIG.SOURCE === 'demo') return Object.assign({}, window.HOME_DATA, {t: Date.now() - 180000});
  const res = await fetch(CONFIG.SB_URL + '/rest/v1/snapshot?id=eq.1&select=data', {cache: 'no-store', headers: {apikey: CONFIG.SB_KEY, Authorization: 'Bearer ' + CONFIG.SB_KEY}});

}

/* trainer + box */
let BOXSTATE = {u: null, f: 'caught', p: 0};
const shN = (t, id) => Math.min(t.c[id] || 0, t.sc[id] !== undefined ? +t.sc[id] || 0 : t.sh.includes(+id) ? 1 : 0);      // shiny copies (included in c)
const nrN = (t, id) => Math.max(0, (t.c[id] || 0) - shN(t, id));      // normal copies
function boxList(t, f){
  if (f === 'dex') return IDS.map(id => ({id, has: t.c[id] > 0, sh: t.c[id] > 0 && !nrN(t, id), cnt: 0}));
  const base = id => isMega(id) ? MEGA[id][1] : id;      // family = base Pokémon: Charizard, Charizard shiny, Mega X, Mega Y...
  let ids = f === 'mega' ? MEGAIDS.slice().sort((a, b) => base(a) - base(b) || a - b) : t.own.concat(t.mega).sort((a, b) => base(a) - base(b) || a - b);
  if (f === 'legend') ids = ids.filter(id => LEG.has(base(id)) || UB.has(base(id)));
  if (f === 'rare') ids = ids.filter(id => RARE.has(base(id)));
  const out = [];
  for (const id of ids){ const n = nrN(t, id), sh = shN(t, id);
    if (f === 'mega' && !(t.c[id] > 0)){ out.push({id, has: false}); continue; }
    if (f !== 'shiny' && n) out.push({id, has: true, sh: false, cnt: n});
    if (sh) out.push({id, has: true, sh: true, cnt: sh}); }      // shiny in its own slot, right after the normal one
  return out;
}
function regionOf(id){ const r = REGIONS.find(r => id >= r.ids[0] && id <= r.ids[r.ids.length - 1]); return r ? r.n : ''; }
function renderBox(){
  const t = BY[BOXSTATE.u.toLowerCase()], L = boxList(t, BOXSTATE.f), pages = Math.max(1, Math.ceil(L.length / 30));
  BOXSTATE.p = Math.min(Math.max(0, BOXSTATE.p), pages - 1);
  const items = L.slice(BOXSTATE.p * 30, BOXSTATE.p * 30 + 30), el = document.getElementById('box');
  const label = BOXSTATE.f === 'dex' && items.length ? regionOf(items[0].id) + ' · ' + (BOXSTATE.p + 1) : BOXSTATE.f === 'mega' ? 'MEGA · ' + (BOXSTATE.p + 1) : 'BOX ' + (BOXSTATE.p + 1);
  let slots = items.map(x => {
    if (!x.has) return isMega(x.id) ? `<div class="slot miss" title="${esc(name(x.id))}">${img(x.id, false)}</div>` : `<div class="slot miss" data-id="${x.id}"><span>${String(x.id).padStart(4, '0')}</span></div>`;
    return `<button class="slot ${x.sh ? 'shy' : ''} ${isMega(x.id) ? 'mg' : ''}" data-id="${x.id}" data-sh="${x.sh ? 1 : 0}">${img(x.id, x.sh)}${x.sh ? '<span class="star">✦</span>' : ''}${isMega(x.id) ? '<span class="mgl">MEGA</span>' : ''}${x.cnt > 1 ? `<span class="cnt">x${x.cnt}</span>` : ''}</button>`;
  }).join('');
  for (let i = items.length; i < 30; i++) slots += '<div class="slot e"></div>';
  const dots = pages <= 14 ? Array.from({length: pages}, (_, i) => `<i class="${i === BOXSTATE.p ? 'on' : ''}"></i>`).join('') : `<span style="color:#fff;font-weight:900;font-size:12px">${BOXSTATE.p + 1} / ${pages}</span>`;
  el.innerHTML = `<div class="boxh"><button id="bp" ${BOXSTATE.p ? '' : 'disabled'} aria-label="Previous box">${ICON.left}</button><b>${label}</b><button id="bn" ${BOXSTATE.p < pages - 1 ? '' : 'disabled'} aria-label="Next box">${ICON.right}</button></div>
    ${L.length ? `<div class="slots">${slots}</div>` : `<div class="boxnote">Nothing here yet</div>`}<div class="boxf">${dots}</div>`;
  el.querySelector('#bp').onclick = () => { BOXSTATE.p--; renderBox(); };
  el.querySelector('#bn').onclick = () => { BOXSTATE.p++; renderBox(); };
  el.querySelectorAll('.slot[data-id]').forEach(s => s.onclick = () => sheet(t, +s.dataset.id, s.dataset.sh === '1'));
  // swipe between boxes on phone
  let x0 = null; el.ontouchstart = e => x0 = e.touches[0].clientX;
  el.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 60){ BOXSTATE.p += dx < 0 ? 1 : -1; renderBox(); } };
}

      <div class="stats"><div class="stat"><b>${fmt(t.n)}</b><span>Caught</span></div><div class="stat"><b>${fmt(t.dex)}</b><span>Pokédex</span></div><div class="stat s"><b>${fmt(t.s)}</b><span>Shiny</span></div><div class="stat l"><b>${fmt(t.leg)}</b><span>Legends</span></div></div>

function sheet(t, id, sh){
  const c = nrN(t, id), s = shN(t, id), rr = rarity(id), types = (M.t[id] || (MEGA[id] || [])[2] || '').split('/').filter(Boolean);
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const draw = () => { bg.innerHTML = `<div class="sheet"><div class="grab"></div>
    <img class="big" src="${spr(id, sh)}" onerror="sprFallback(this,${id},${sh ? 1 : 0})" alt="">
    <div class="no">${isMega(id) ? 'from ' + esc(name(MEGA[id][1])) + ' · ' + pad(MEGA[id][1]) : pad(id) + ' · ' + regionOf(id)}</div><h3>${sh ? '✦ ' : ''}${esc(name(id))}</h3>
    ${rr ? `<span class="tag ${rr[0]}">${rr[1]}</span>` : ''}
    <div class="types">${types.map(x => `<span class="type" style="background:${TYPEC[x] || '#999'}">${x}</span>`).join('')}</div>
    <div class="sgrid"><div class="stat"><b>${c}</b><span>Normal</span></div><div class="stat s"><b>${s}</b><span>Shiny</span></div></div>
    ${s ? `<button class="tog" id="tog">${sh ? 'Show normal' : 'Show shiny'}</button>` : ''}</div>`;
    const tg = bg.querySelector('#tog'); if (tg) tg.onclick = e => { e.stopPropagation(); sh = !sh; draw(); }; };
  draw(); bg.onclick = e => { if (e.target === bg) bg.remove(); };

/* ===== PHASE 2: profiles + verification with !home ===== */
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const DEMO = CONFIG.SOURCE === 'demo';
let PROF = {}, AUTH = LS.get('lch_auth', null), ME = null;      // AUTH = {u, token} saved on this phone after !home
const demoProf = {giulia_shinyhunt: {fav: [448, 445, 700, 282, 6, 94], wish: [384, 483, 484, 249], partner: 448}}, demoClaims = {};
function devId(){ let d = LS.get('lch_dev', null); if (!d){ d = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''); LS.set('lch_dev', d); } return d; }
const SBH = () => ({'Content-Type': 'application/json', apikey: CONFIG.SB_KEY, Authorization: 'Bearer ' + CONFIG.SB_KEY});
async function rpc(fn, body){
  if (DEMO) return demoRpc(fn, body);
  const r = await fetch(CONFIG.SB_URL + '/rest/v1/rpc/' + fn, {method: 'POST', headers: SBH(), body: JSON.stringify(body)});
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) throw new Error((j && j.message) || 'Something went wrong'); return j;
}
function demoRpc(fn, b){      // ?demo only: fakes the server (verification completes by itself after 4 s)
  const du = tk => (tk || '').replace(/^demo-/, '');
  if (fn === 'request_code'){ const c = String(1000 + Math.floor(Math.random() * 9000)); demoClaims[b.p_u] = {c, t: Date.now()}; return c; }
  if (fn === 'check_claim'){ const k = demoClaims[b.p_u]; if (k && Date.now() - k.t > 4000){ delete demoClaims[b.p_u]; return 'demo-' + b.p_u; } return null; }
  if (fn === 'my_profile'){ const u = du(b.p_token), p = demoProf[u] || {}; return {u, fav: p.fav || [], wish: p.wish || [], partner: p.partner || null, hidden: !!p.hidden}; }
  if (fn === 'save_profile'){ demoProf[du(b.p_token)] = {fav: b.p_fav, wish: b.p_wish, partner: b.p_partner, hidden: b.p_hidden}; return null; }
  return null;
}
async function loadProfiles(){
  if (DEMO){ PROF = {}; for (const [u, p] of Object.entries(demoProf)) if (!p.hidden) PROF[u.toLowerCase()] = p; return; }
  try { const r = await fetch(CONFIG.SB_URL + '/rest/v1/profiles?select=u,fav,wish,partner', {cache: 'no-store', headers: SBH()});
    if (r.ok){ const P = {}; for (const p of await r.json()) P[p.u.toLowerCase()] = p; PROF = P; } } catch(e){}
}
async function loadMe(){
  if (!AUTH){ ME = null; return; }
  try { ME = await rpc('my_profile', {p_token: AUTH.token}); if (!ME){ AUTH = null; LS.set('lch_auth', null); } } catch(e){}
}
const isMe = u => !!(AUTH && ME && ME.u.toLowerCase() === String(u).toLowerCase());
function openSheet(html, cls = ''){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet ${cls}"><div class="grab"></div>${html}</div>`;
  bg.onclick = e => { if (e.target === bg) close(); };
  const close = () => { bg.remove(); bg.closed = true; }; bg.close = close;
  document.body.appendChild(bg); return bg;
}
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* "This is me": code on the site -> "!home 1234" in the live chat from that TikTok account -> this phone is linked */
async function openClaim(u){
  const bg = openSheet(`<h3>Is this you?</h3><p class="sub">Getting your code...</p>`);
  let code;
  try { code = await rpc('request_code', {p_u: u, p_dev: devId()}); }
  catch(e){ bg.querySelector('.sub').textContent = 'Could not get a code: ' + e.message; return; }
  LS.set('lch_pending', {u, until: Date.now() + 10 * 60000});
  bg.querySelector('.sheet').innerHTML = `<div class="grab"></div><h3>Link your page</h3>
    <p class="sub">During the live, write this in the TikTok chat from <b>@${esc(u)}</b> within 10 minutes:</p>
    <div class="code">!home ${code}</div>
    <p class="status" id="cst"><i class="spin"></i>Waiting for your message in the live...</p>
    <p class="warn">The code only works if it is written by @${esc(u)}. Never type a code that someone else gives you.</p>
    <button class="btn ghost" id="cclose">Close</button>`;
  bg.querySelector('#cclose').onclick = bg.close;
  pollClaim(u, bg);
}
let pollT = null;
function pollClaim(u, bg){
  clearInterval(pollT);
  pollT = setInterval(async () => {
    const pend = LS.get('lch_pending', null);
    if (!pend || pend.u !== u || Date.now() > pend.until){ clearInterval(pollT); LS.set('lch_pending', null); if (bg && !bg.closed){ const s = bg.querySelector('#cst'); if (s) s.textContent = 'Code expired. Close and try again.'; } return; }
    let tok = null; try { tok = await rpc('check_claim', {p_u: u, p_dev: devId()}); } catch(e){}
    if (!tok) return;
    clearInterval(pollT); LS.set('lch_pending', null);
    AUTH = {u, token: tok}; LS.set('lch_auth', AUTH); await loadMe();
    if (bg && !bg.closed) bg.close();
    toast('Verified! Now you can edit your page.'); route();
  }, DEMO ? 1500 : 4000);
}

/* Edit my page: partner, favorites, wishlist, privacy */
function openEdit(){
  if (!ME) return;
  const t = BY[ME.u.toLowerCase()], own = t ? t.own.slice().sort((a, b) => a - b).concat(t.mega) : [];
  const E = {fav: [...(ME.fav || [])], wish: [...(ME.wish || [])], partner: ME.partner || 0, hidden: !!ME.hidden}, st = {tab: t ? 'partner' : 'privacy', q: ''};
  const bg = openSheet('', 'edit'), sh = bg.querySelector('.sheet');
  const TABS = [['partner', 'Partner'], ['fav', 'Favorites'], ['wish', 'Wishlist'], ['privacy', 'Privacy']];
  const pick = id => `<button class="slot pk ${(st.tab === 'fav' ? E.fav.includes(id) : st.tab === 'wish' ? E.wish.includes(id) : E.partner === id) ? 'sel' : ''}" data-id="${id}">${img(id, false)}<span>${esc(name(id))}</span></button>`;
  const draw = () => {
    const pool = st.tab === 'wish' ? IDS.concat(MEGAIDS) : own, q = st.q.trim().toLowerCase();
    const list = pool.filter(id => !q || name(id).toLowerCase().includes(q) || String(id) === q), shown = list.slice(0, 120);
    const sel = st.tab === 'fav' ? `<div class="team">${Array.from({length: 6}, (_, i) => E.fav[i] ? `<button class="tm rm" data-rm="${E.fav[i]}">${img(E.fav[i], false)}</button>` : '<div class="tm e"></div>').join('')}</div><p class="hint">${E.fav.length}/6 · tap to remove</p>`
      : st.tab === 'wish' ? (E.wish.length ? `<div class="wish">${E.wish.map(id => `<button class="tm rm" data-rm="${id}">${img(id, false)}</button>`).join('')}</div>` : '') + `<p class="hint">${E.wish.length}/30 · the Pokémon you are looking for</p>`
      : st.tab === 'partner' ? `<div class="pbig">${E.partner ? `<button class="rm" data-rm="${E.partner}">${img(E.partner, false)}</button>` : '<span>No partner</span>'}</div><p class="hint">Shown next to your name</p>` : '';
    sh.innerHTML = `<div class="grab"></div><h3>Edit my page</h3><p class="sub">@${esc(ME.u)}</p>
      <div class="chips ctr">${TABS.map(([k, l]) => `<button class="chip ${k === st.tab ? 'on' : ''}" data-tab="${k}" ${!t && k !== 'privacy' ? 'disabled' : ''}>${l}</button>`).join('')}</div>
      ${st.tab === 'privacy' ? `<label class="sw"><input type="checkbox" id="hid" ${E.hidden ? 'checked' : ''}><span></span><div><b>Hide my page</b><small>Your box disappears from the site and the rankings. You stay in the live game as usual.</small></div></label>
        <button class="btn ghost" id="logout" style="margin-top:14px">Log out on this phone</button>`
      : `${sel}<div class="search sm">${ICON.home}<input id="pq" type="search" placeholder="${st.tab === 'wish' ? 'Search any Pokémon' : 'Search your Pokémon'}" value="${esc(st.q)}" autocomplete="off"></div>
        <div class="picker">${shown.map(pick).join('') || '<p class="hint">No Pokémon found</p>'}</div>${list.length > shown.length ? `<p class="hint">${list.length - shown.length} more: type a name to search</p>` : ''}`}
      <div class="savebar"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>`;
    sh.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (b.disabled) return; st.tab = b.dataset.tab; st.q = ''; draw(); });
    sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const id = +b.dataset.rm; if (st.tab === 'fav') E.fav = E.fav.filter(x => x !== id); else if (st.tab === 'wish') E.wish = E.wish.filter(x => x !== id); else E.partner = 0; draw(); });
    sh.querySelectorAll('.pk').forEach(b => b.onclick = () => { const id = +b.dataset.id;
      if (st.tab === 'partner') E.partner = E.partner === id ? 0 : id;
      else { const k = st.tab, max = k === 'fav' ? 6 : 30, a = E[k]; if (a.includes(id)) E[k] = a.filter(x => x !== id); else if (a.length < max) a.push(id); else return toast('Max ' + max + ' Pokémon'); }
      draw(); });
    const pq = sh.querySelector('#pq'); if (pq) pq.oninput = () => { st.q = pq.value; const p = pq.selectionStart; draw(); const n = sh.querySelector('#pq'); n.focus(); n.setSelectionRange(p, p); };
    const hid = sh.querySelector('#hid'); if (hid) hid.onchange = () => E.hidden = hid.checked;
    const lo = sh.querySelector('#logout'); if (lo) lo.onclick = async () => { try { await rpc('logout', {p_token: AUTH.token}); } catch(e){} AUTH = null; ME = null; LS.set('lch_auth', null); bg.close(); toast('Logged out on this phone'); route(); };
    sh.querySelector('#cancel').onclick = bg.close;
    sh.querySelector('#save').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Saving...';
      try { await rpc('save_profile', {p_token: AUTH.token, p_fav: E.fav, p_wish: E.wish, p_partner: E.partner || null, p_hidden: E.hidden});
        const wasHidden = ME.hidden; await loadMe(); await loadProfiles(); if (E.hidden !== wasHidden && !DEMO) build(await load()); else if (DEMO && E.hidden) { delete BY[ME.u.toLowerCase()]; T = T.filter(x => x.u !== ME.u); }
        bg.close(); toast(E.hidden ? 'Saved. Your page is now hidden.' : 'Saved!'); route(); }
      catch(err){ e.target.disabled = false; e.target.textContent = 'Save'; toast(/verified/.test(err.message) ? 'Please verify again with !home' : 'Could not save, try again'); if (/verified/.test(err.message)){ AUTH = null; ME = null; LS.set('lch_auth', null); bg.close(); route(); } } };
  };
  draw();
}

function viewPrivacy(){
  nav('');
  return `<div class="rankg"><a class="back" href="#/">${ICON.left}Back</a><div class="card legal">
  <h1>Privacy</h1><p class="hint" style="text-align:left">Last update: 24 October 2026</p>
  <h4>Who runs this page</h4><p>Live Catch HOME is a free, non-commercial fan page for the players of the Live Catch game on TikTok, run by the host of the live. Contact: ${CONFIG.CONTACT}.</p>
  <h4>What is shown</h4><p>Only your TikTok username, your public TikTok profile picture and your game data from the live (Pokémon caught, shiny, legendaries, team, streak, rankings). No gift or coin amounts are shown.</p>
  <h4>Where it comes from</h4><p>The Live Catch game reads the public events of the live (username, public profile picture and the game commands written in chat) to run the game. Chat messages are not published on this page.</p>
  <h4>If you link your page</h4><p>When you use "This is me" and write <b>!home</b> in the live chat, we save a random key in your browser to keep you logged in, and your choices (partner, favorites, wishlist, privacy). No email, no password, no other personal data.</p>
  <h4>Why</h4><p>To run the community features of the game (boxes, rankings, Hall of Fame), which is the legitimate interest of the game and of its players.</p>
  <h4>Where the data is kept</h4><p>Game data is kept in a Supabase database. The page is hosted on GitHub Pages. Pokémon images are loaded from jsDelivr (PokeAPI) and profile pictures from TikTok's servers: these services may see your IP address, as for any website.</p>
  <h4>Cookies</h4><p>No ads, no tracking, no analytics. Only technical browser storage to keep you logged in.</p>
  <h4>How long</h4><p>As long as the Live Catch game runs. Verification codes expire after 15 minutes.</p>
  <h4>Your rights</h4><p>You can hide your page at any time: link it with !home, then Edit my page → Privacy → Hide my page. You can ask to see, correct or delete your data by contacting the host. You can also complain to your data protection authority (in Italy: Garante per la protezione dei dati personali).</p>
  <h4>Not official</h4><p>This page is not affiliated with or endorsed by TikTok, Nintendo, The Pokémon Company, Game Freak or Creatures. Pokémon and Pokémon names are trademarks of their respective owners. Images: PokeAPI.</p>
  </div></div>`;
}

/* ===== ROUTER ===== */
function route(){
  const app = document.getElementById('app'); if (!D) return;
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), [a, b] = [h.split('/')[0], h.split('/').slice(1).join('/')];
  document.querySelectorAll('.sheet-bg').forEach(x => x.remove());
  app.innerHTML = (a === 't' && b ? viewTrainer(b) : a === 'rank' ? viewRank(b) : a === 'hof' ? viewHof() : a === 'privacy' ? viewPrivacy() : viewHome())
    + `<div class="foot">Fan-made page for the Live Catch community. Not affiliated with Nintendo, The Pokémon Company or Game Freak.<br><a href="#/privacy">Privacy</a></div>`;
  bindSearch(); bindTrainer(); setUpd(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
async function start(){
  try { const [d] = await Promise.all([load(), loadProfiles(), loadMe()]); build(d); } catch(e){ document.getElementById('app').innerHTML = '<div class="card">Could not load data. Try again in a minute.</div>'; return; }
  route();
  const pend = LS.get('lch_pending', null); if (pend && Date.now() < pend.until && !AUTH) pollClaim(pend.u, null);
  setInterval(setUpd, 30000);
  if (!DEMO) setInterval(async () => { try { const [d] = await Promise.all([load(), loadProfiles()]); if (d && d.t !== D.t){ build(d); if (!document.querySelector('.sheet-bg') && document.activeElement.id !== 'q') route(); else setUpd(); } } catch(e){} }, CONFIG.REFRESH_MIN * 60000);
}
start();
</script>
