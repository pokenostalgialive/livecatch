<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Catch HOME</title>
<meta name="theme-color" content="#16a99e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e3f5f3; --bg2:#dde8fb; --card:#ffffff; --ink:#1d2a3a; --mute:#6c7a8c; --line:#e3e9f0;
  --teal:#16a99e; --blue:#2f6fe0; --gold:#e8a917; --pink:#e5587e; --violet:#7a5cf0;
  --box1:#79d6c8; --box2:#6aa9ec; --slot:rgba(255,255,255,.55); --slotE:rgba(255,255,255,.22);
  --r:18px; --shadow:0 6px 22px rgba(30,60,100,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;font-size:18px}
.logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--teal),var(--blue),var(--teal));position:relative;flex:none}
.logo i:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.logo small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:0}
.upd{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700;text-align:right}
.upd b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:5px;vertical-align:1px}
.tabs{display:flex;gap:4px}
.tabs a{font-weight:800;font-size:14px;color:var(--mute);text-decoration:none;padding:8px 14px;border-radius:999px}
.tabs a.on{background:var(--ink);color:#fff}
.dtabs{display:none}
.btabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.btabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-weight:800;font-size:12px;padding:6px 0;border-radius:14px}
.btabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.btabs a.on{color:var(--teal)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2{font-size:15px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:22px 4px 10px}
h2:first-child{margin-top:4px}
/* search */
.hero{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:22px;padding:20px 16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.12)}
.hero h1{font-size:23px;font-weight:900;line-height:1.15;position:relative}
.hero p{opacity:.9;font-weight:700;font-size:14px;margin-top:4px;position:relative}
.search{position:relative;margin-top:14px}
.search input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px 16px 14px 46px;border-radius:16px;border:0;outline:0;color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:5;color:var(--ink)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;font-weight:800}
.sugg button:not(:last-child){border-bottom:1px solid var(--line)}
.sugg small{margin-left:auto;color:var(--mute);font-weight:700}
.sugg .none{padding:14px;color:var(--mute);font-weight:700}
/* stats strip */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.today div{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.today b{display:block;font-size:22px;font-weight:900}
.today span{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
/* hall of fame */
.hof{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hofc{border-radius:var(--r);padding:12px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:center;cursor:pointer}
.hofc.sh{background:linear-gradient(150deg,#ffb84d,#e5587e)}
.hofc.lg{background:linear-gradient(150deg,#7a5cf0,#2f6fe0)}
.hofc .lab{font-size:11px;font-weight:900;letter-spacing:1px;opacity:.95}
.hofc img{width:104px;height:104px;margin:4px auto 2px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));object-fit:contain}
.hofc .nm{font-weight:900;font-size:16px}
.hofc .by{font-size:12px;font-weight:700;opacity:.95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* list rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.row:not(:last-child){border-bottom:1px solid var(--line)}
.row:active{background:#f4f8fb}
.pos{width:26px;text-align:center;font-weight:900;color:var(--mute);flex:none}
.pos.p1,.pos.p2,.pos.p3{color:#fff;border-radius:50%;height:26px;line-height:26px;font-size:13px}
.pos.p1{background:#e8b923}.pos.p2{background:#a9b4c2}.pos.p3{background:#cd8a52}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-weight:900;font-size:17px;text-align:right}
.val small{display:block;font-size:10px;color:var(--mute);font-weight:800;text-transform:uppercase}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:#dfe7ef;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--mute);box-shadow:0 2px 8px rgba(30,60,100,.08)}
.chip.on{background:var(--ink);color:#fff}
/* trainer */
.tgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tgrid>div,.homeg>div{min-width:0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--teal)}
.prof h1{font-size:22px;font-weight:900;line-height:1.1;word-break:break-all}
.ttl{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:#fde7ee;color:var(--pink);font-size:11px;font-weight:900;letter-spacing:.5px}
.meta{font-size:13px;color:var(--mute);font-weight:800;margin-top:6px}
.meta span+span:before{content:" · "}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#f3f7fa;border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:10px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.stat.s b{color:var(--gold)}.stat.l b{color:var(--violet)}
.team{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm{aspect-ratio:1;background:#f3f7fa;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer}
.tm img{width:86%;height:86%;object-fit:contain}
.tm.e{background:repeating-linear-gradient(45deg,#f3f7fa,#f3f7fa 6px,#edf2f6 6px,#edf2f6 12px);cursor:default}
.empty{color:var(--mute);font-weight:700;font-size:13px;margin-top:8px}
.regs{display:grid;gap:8px}
.reg{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:13px;font-weight:900}
.bar{height:10px;background:#edf2f6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.reg.done .bar i{background:linear-gradient(90deg,#f2c230,#e8a917)}
.reg em{font-style:normal;text-align:right;color:var(--mute);font-weight:800;font-size:12px}
.reg.done em{color:var(--gold)}
/* box */
.box{border-radius:22px;padding:12px;background:linear-gradient(160deg,var(--box1),var(--box2));box-shadow:var(--shadow)}
.boxh{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px}
.boxh b{font-weight:900;letter-spacing:.8px;font-size:16px;background:rgba(255,255,255,.22);padding:6px 16px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.boxh button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center}
.boxh button:disabled{opacity:.35}
.boxh svg{width:20px;height:20px;color:#fff}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:14px;background:var(--slot);position:relative;display:grid;place-items:center;cursor:pointer}
.slot img{width:92%;height:92%;object-fit:contain}
.slot.e{background:var(--slotE);cursor:default}
.slot.miss{background:var(--slotE)}
.slot.miss span{color:rgba(255,255,255,.85);font-size:10px;font-weight:900}
.slot.miss img{filter:brightness(0) opacity(.18)}
.cnt{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:900;background:#fff;color:var(--ink);border-radius:99px;padding:0 5px;line-height:15px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.star{position:absolute;left:4px;top:2px;font-size:13px;color:#ffcf3a;text-shadow:0 0 3px rgba(150,90,0,.8)}
.boxf{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.boxf i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.boxf i.on{background:#fff}
.boxnote{color:#fff;font-weight:800;font-size:13px;text-align:center;padding:30px 0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#d8e0e8;margin:0 auto 10px}
.sheet .big{width:180px;height:180px;margin:0 auto;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.sheet .no{font-weight:900;color:var(--mute);font-size:13px}
.sheet h3{font-size:24px;font-weight:900}
.types{display:flex;gap:6px;justify-content:center;margin:8px 0}
.type{padding:3px 12px;border-radius:99px;color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.6px;margin-top:4px}
.tag.legend{background:#ece6ff;color:var(--violet)}.tag.rare{background:#e3f0ff;color:var(--blue)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tog{margin-top:12px;font-weight:900;font-size:13px;padding:9px 16px;border-radius:99px;background:#fff6dc;color:#9b6c00}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.back{text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--mute);margin-bottom:10px;font-size:14px}
.back svg{width:18px;height:18px}
.foot{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin:26px 0 8px}
/* desktop */
@media(min-width:860px){
  body{padding-bottom:0}
  .btabs{display:none}
  .dtabs{display:flex;margin-left:24px}
  .upd{margin-left:auto}
  main{padding:24px 16px}
  .homeg{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .tgrid{grid-template-columns:400px minmax(0,1fr);align-items:start}
  .tgrid .side{position:sticky;top:80px}
  .hero{padding:30px 26px 26px}.hero h1{font-size:30px}
  .slots{gap:8px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px}
  .rankg{max-width:720px;margin:0 auto}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/" style="text-decoration:none;color:inherit"><i></i><div>LIVE CATCH HOME<small>Your Pokémon from the live</small></div></a>
  <nav class="tabs dtabs" id="dtabs"></nav>
  <div class="upd" id="upd"></div>
</div></header>
<main id="app"></main>
<nav class="btabs" id="btabs"></nav>

<script src="meta.js"></script>
<script src="demo_data.js"></script>
<script>
/* ===== CONFIG =====
   Default: live data from Supabase (sent by the game every 5 min).
   Add ?demo to the address to see the fake demo data. */
const CONFIG = { SOURCE: /[?&]demo/.test(location.search) ? 'demo' : 'supabase', REFRESH_MIN: 5,
  SB_URL: 'https://pdkxuxpvglrupzacpjdg.supabase.co',
  SB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBka3h1eHB2Z2xydXB6YWNwamRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjM4MTMsImV4cCI6MjEwODMzOTgxM30.sBaf9mCEu_0pgSWIo7qhaSJtmhWxtPvNHC5THXangAw' };

const M = window.META, LEG = new Set(M.leg), RARE = new Set(M.rare), UB = new Set(M.ub), PARALEG = new Set(M.paraleg), PARADOX = new Set(M.paradox), EVENT = new Set(M.event);
const IDS = Object.keys(M.n).map(Number).sort((a, b) => a - b);
const REGIONS = M.reg.map(([n, a, b]) => ({n, ids: IDS.filter(id => id >= a && id <= b && !EVENT.has(id))}));
const name = id => M.n[id] || ('#' + id);
const pad = id => '#' + String(id).padStart(4, '0');
const SPR = 'https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/';
const spr = (id, sh) => SPR + 'other/home/' + (sh ? 'shiny/' : '') + id + '.png';
const sprFallback = (img, id, sh) => { img.onerror = null; img.src = SPR + (sh ? 'shiny/' : '') + id + '.png'; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => (n || 0).toLocaleString('en-US');
const rarity = id => UB.has(id) ? ['legend', 'ULTRA BEAST'] : PARALEG.has(id) ? ['legend', 'PARADOX LEGEND'] : LEG.has(id) ? ['legend', 'LEGENDARY'] : PARADOX.has(id) ? ['rare', 'PARADOX'] : RARE.has(id) ? ['rare', 'RARE'] : null;
const TYPEC = {normal:'#9fa19f',fire:'#e62829',water:'#2980ef',grass:'#3fa129',electric:'#d6b400',ice:'#3dcef3',fighting:'#ff8000',poison:'#9141cb',ground:'#915121',flying:'#81b9ef',psychic:'#ef4179',bug:'#91a119',rock:'#afa981',ghost:'#704170',dragon:'#5060e1',dark:'#624d4e',steel:'#60a1b8',fairy:'#ef70ef'};
const img = (id, sh, cls = '') => `<img class="${cls}" loading="lazy" alt="${esc(name(id))}" src="${spr(id, sh)}" onerror="sprFallback(this,${id},${sh ? 1 : 0})">`;
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  rank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>',
  hof: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
};

/* ===== DATA ===== */
let D = null, T = [], BY = {};
function build(data){
  D = data; const dex = data.dex || {}, av = data.av || {}, wk = (data.week || {}).n || {};
  T = Object.entries(dex).map(([u, d]) => {
    const c = d.c || {}, own = Object.keys(c).filter(k => c[k] > 0).map(Number);
    return {u, n: d.n || 0, s: d.s || 0, c, sc: d.sc || {}, sh: d.sh || [], own, dex: own.length, leg: own.filter(id => LEG.has(id)).length,
      team: (d.team || []).filter(id => M.n[id]), st: d.st || 0, last: d.last, title: d.title || null, badges: d.badges || [], av: av[u] || null, wk: wk[u] || 0};
  });
  BY = {}; for (const t of T) BY[t.u.toLowerCase()] = t;
  const r = [...T].sort((a, b) => b.n - a.n); r.forEach((t, i) => t.rank = i + 1);
}
async function load(){
  if (CONFIG.SOURCE === 'demo') return Object.assign({}, window.HOME_DATA, {t: Date.now() - 180000});
  const res = await fetch(CONFIG.SB_URL + '/rest/v1/snapshot?id=eq.1&select=data', {cache: 'no-store', headers: {apikey: CONFIG.SB_KEY, Authorization: 'Bearer ' + CONFIG.SB_KEY}});
  if (!res.ok) throw new Error('http ' + res.status);
  const rows = await res.json(); return (rows[0] && rows[0].data) || {};
}
function ago(t){ if (!t) return ''; const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}); }

/* ===== UI helpers ===== */
const COLORS = ['#16a99e', '#2f6fe0', '#e5587e', '#7a5cf0', '#e8a917', '#ef7d2d', '#3fa129', '#d23f8c'];
function avatar(t, cls = 'av'){
  const ch = (t.u.replace(/[^a-z0-9]/gi, '')[0] || '?').toUpperCase(), col = COLORS[[...t.u].reduce((s, c) => s + c.charCodeAt(0), 0) % COLORS.length];
  return `<span class="${cls}" style="background:${col}">${t.av ? `<img src="${esc(t.av)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${t.av ? '' : ch}</span>`;
}
const link = u => '#/t/' + encodeURIComponent(u);
function nav(active){
  const it = [['home', '#/', 'Trainers'], ['rank', '#/rank', 'Rankings'], ['hof', '#/hof', 'Hall of Fame']];
  document.getElementById('btabs').innerHTML = it.map(([k, h, l]) => `<a href="${h}" class="${k === active ? 'on' : ''}">${ICON[k]}${l}</a>`).join('');
  document.getElementById('dtabs').innerHTML = it.map(([k, h, l]) => `<a href="${h}" class="${k === active ? 'on' : ''}">${l}</a>`).join('');
}
function setUpd(){ document.getElementById('upd').innerHTML = D && D.t ? `<b></b>Updated ${ago(D.t)}` : ''; }

/* ===== RANKINGS ===== */
const RANKS = {
  catches: {l: 'Catches', v: t => t.n, u: 'caught'},
  dex: {l: 'Pokédex', v: t => t.dex, u: 'species'},
  shiny: {l: 'Shiny', v: t => t.s, u: 'shiny'},
  legend: {l: 'Legendary', v: t => t.leg, u: 'legends'},
  week: {l: 'This week', v: t => t.wk, u: 'this week'},
  last: {l: 'Last week', v: t => ((D.weekPrev || {}).n || {})[t.u] || 0, u: 'last week'}
};
function rankRows(key, limit){
  const R = RANKS[key], rows = T.map(t => [t, R.v(t)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, limit || 100);
  if (!rows.length) return `<div class="list"><div class="row" style="color:var(--mute);font-weight:700">No data yet</div></div>`;
  return `<div class="list">${rows.map(([t, v], i) => `<a class="row" href="${link(t.u)}" style="text-decoration:none;color:inherit">
    <span class="pos ${i < 3 ? 'p' + (i + 1) : ''}">${i + 1}</span>${avatar(t)}
    <span class="who"><b>${esc(t.u)}</b>${t.title ? `<small>${esc(t.title)}</small>` : ''}</span>
    <span class="val">${fmt(v)}<small>${R.u}</small></span></a>`).join('')}</div>`;
}

/* ===== VIEWS ===== */
function hofCards(){
  const h = D.hof || {}, card = (e, cls, lab) => e && M.n[e.id] ? `<a class="hofc ${cls}" href="${link(e.u)}" style="text-decoration:none">
    <div class="lab">${lab}</div>${img(e.id, e.sh)}<div class="nm">${e.sh ? '✦ ' : ''}${esc(name(e.id))}</div><div class="by">by ${esc(e.u)}</div></a>`
    : `<div class="hofc ${cls}"><div class="lab">${lab}</div><div style="padding:40px 0;font-weight:800;opacity:.9">Not yet</div></div>`;
  return `<div class="hof">${card(h.shiny, 'sh', 'LAST SHINY')}${card(h.legend, 'lg', 'LAST LEGENDARY')}</div>`;
}
function viewHome(){
  nav('home'); const day = D.day || {};
  return `<div class="homeg"><div>
    <section class="hero"><h1>Find your box</h1><p>Search your TikTok name to see every Pokémon you caught live.</p>
      <div class="search">${ICON.home}<input id="q" type="search" placeholder="Your TikTok name" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><div class="sugg" id="sugg" hidden></div></div></section>
    ${T.length ? '' : `<div class="card" style="margin-top:12px;font-weight:800;color:var(--mute);text-align:center">The boxes fill up during the next live. Come back soon!</div>`}
    <div class="today"><div><b>${fmt(T.length)}</b><span>Trainers</span></div><div><b>${fmt(T.reduce((s, t) => s + t.n, 0))}</b><span>Caught</span></div><div><b>${fmt(day.n)}</b><span>Today</span></div></div>
    <h2>Hall of Fame</h2>${hofCards()}
  </div><div>
    <h2>Top trainers</h2>${rankRows('catches', 5)}
    <h2>This week</h2>${rankRows('week', 5)}
    <div style="text-align:center;margin-top:12px"><a class="chip on" href="#/rank" style="text-decoration:none;display:inline-block">All rankings</a></div>
  </div></div>`;
}
function bindSearch(){
  const q = document.getElementById('q'), sg = document.getElementById('sugg'); if (!q) return;
  const run = () => { const v = q.value.trim().toLowerCase().replace(/^@/, ''); if (!v){ sg.hidden = true; return; }
    const hit = T.filter(t => t.u.toLowerCase().includes(v)).sort((a, b) => (b.u.toLowerCase().startsWith(v) - a.u.toLowerCase().startsWith(v)) || b.n - a.n).slice(0, 6);
    sg.innerHTML = hit.length ? hit.map(t => `<button data-u="${esc(t.u)}">${avatar(t)}<span>${esc(t.u)}</span><small>${fmt(t.n)} caught</small></button>`).join('') : `<div class="none">No trainer found. Catch something in the live first!</div>`;
    sg.hidden = false; };
  q.addEventListener('input', run);
  q.addEventListener('keydown', e => { if (e.key === 'Enter'){ const b = sg.querySelector('button'); if (b) location.hash = link(b.dataset.u); } });
  sg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = link(b.dataset.u); });
}
function viewRank(key){
  nav('rank'); key = RANKS[key] ? key : 'catches';
  return `<div class="rankg"><h2>Rankings</h2><div class="chips">${Object.entries(RANKS).map(([k, r]) => `<a class="chip ${k === key ? 'on' : ''}" href="#/rank/${k}" style="text-decoration:none">${r.l}</a>`).join('')}</div>${rankRows(key)}</div>`;
}
function viewHof(){
  nav('hof');
  const top = (k, lab) => { const R = RANKS[k], t = [...T].sort((a, b) => R.v(b) - R.v(a))[0]; return t && R.v(t) ? `<a class="row" href="${link(t.u)}" style="text-decoration:none;color:inherit">${avatar(t)}<span class="who"><b>${esc(t.u)}</b><small style="color:var(--mute)">${lab}</small></span><span class="val">${fmt(R.v(t))}</span></a>` : ''; };
  const masters = T.filter(t => t.badges.length).sort((a, b) => b.badges.length - a.badges.length);
  return `<div class="rankg"><h2>Hall of Fame</h2>${hofCards()}
    <h2>Record holders</h2><div class="list">${top('catches', 'Most catches')}${top('dex', 'Biggest Pokédex')}${top('shiny', 'Most shiny')}${top('legend', 'Most legendaries')}</div>
    <h2>Region masters</h2>${masters.length ? `<div class="list">${masters.map(t => `<a class="row" href="${link(t.u)}" style="text-decoration:none;color:inherit">${avatar(t)}<span class="who"><b>${esc(t.u)}</b><small style="color:var(--gold)">${t.badges.map(esc).join(' · ')}</small></span></a>`).join('')}</div>` : `<div class="card empty" style="margin:0">Nobody has completed a region yet.</div>`}</div>`;
}

/* trainer + box */
let BOXSTATE = {u: null, f: 'caught', p: 0};
function boxList(t, f){
  if (f === 'dex') return IDS.map(id => ({id, has: t.c[id] > 0}));
  let ids = t.own.slice().sort((a, b) => a - b);
  if (f === 'shiny') ids = Object.keys(t.sc).filter(k => t.sc[k] > 0).map(Number).sort((a, b) => a - b).concat(t.sh.filter(id => !t.sc[id])).filter((v, i, a) => a.indexOf(v) === i);
  if (f === 'legend') ids = ids.filter(id => LEG.has(id) || UB.has(id));
  if (f === 'rare') ids = ids.filter(id => RARE.has(id));
  return ids.map(id => ({id, has: true, sh: f === 'shiny'}));
}
function regionOf(id){ const r = REGIONS.find(r => id >= r.ids[0] && id <= r.ids[r.ids.length - 1]); return r ? r.n : ''; }
function renderBox(){
  const t = BY[BOXSTATE.u.toLowerCase()], L = boxList(t, BOXSTATE.f), pages = Math.max(1, Math.ceil(L.length / 30));
  BOXSTATE.p = Math.min(Math.max(0, BOXSTATE.p), pages - 1);
  const items = L.slice(BOXSTATE.p * 30, BOXSTATE.p * 30 + 30), el = document.getElementById('box');
  const label = BOXSTATE.f === 'dex' && items.length ? regionOf(items[0].id) + ' · ' + (BOXSTATE.p + 1) : 'BOX ' + (BOXSTATE.p + 1);
  let slots = items.map(x => {
    if (!x.has) return `<div class="slot miss" data-id="${x.id}"><span>${String(x.id).padStart(4, '0')}</span></div>`;
    const cnt = x.sh ? t.sc[x.id] || 1 : t.c[x.id] || 0, shOwned = t.sc[x.id] > 0 || t.sh.includes(x.id);
    return `<button class="slot" data-id="${x.id}" data-sh="${x.sh ? 1 : 0}">${img(x.id, x.sh)}${!x.sh && shOwned ? '<span class="star">✦</span>' : ''}${cnt > 1 ? `<span class="cnt">x${cnt}</span>` : ''}</button>`;
  }).join('');
  for (let i = items.length; i < 30; i++) slots += '<div class="slot e"></div>';
  const dots = pages <= 14 ? Array.from({length: pages}, (_, i) => `<i class="${i === BOXSTATE.p ? 'on' : ''}"></i>`).join('') : `<span style="color:#fff;font-weight:900;font-size:12px">${BOXSTATE.p + 1} / ${pages}</span>`;
  el.innerHTML = `<div class="boxh"><button id="bp" ${BOXSTATE.p ? '' : 'disabled'} aria-label="Previous box">${ICON.left}</button><b>${label}</b><button id="bn" ${BOXSTATE.p < pages - 1 ? '' : 'disabled'} aria-label="Next box">${ICON.right}</button></div>
    ${L.length ? `<div class="slots">${slots}</div>` : `<div class="boxnote">Nothing here yet</div>`}<div class="boxf">${dots}</div>`;
  el.querySelector('#bp').onclick = () => { BOXSTATE.p--; renderBox(); };
  el.querySelector('#bn').onclick = () => { BOXSTATE.p++; renderBox(); };
  el.querySelectorAll('.slot[data-id]').forEach(s => s.onclick = () => sheet(t, +s.dataset.id, s.dataset.sh === '1'));
  // swipe between boxes on phone
  let x0 = null; el.ontouchstart = e => x0 = e.touches[0].clientX;
  el.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 60){ BOXSTATE.p += dx < 0 ? 1 : -1; renderBox(); } };
}
function viewTrainer(u){
  const t = BY[u.toLowerCase()];
  nav('home');
  if (!t) return `<a class="back" href="#/">${ICON.left}Back</a><div class="card"><b>Trainer not found</b><p class="empty">Check the spelling of the TikTok name, or catch your first Pokémon in the live.</p></div>`;
  if (BOXSTATE.u !== t.u) BOXSTATE = {u: t.u, f: 'caught', p: 0};
  const F = [['caught', 'Caught ' + t.dex], ['shiny', 'Shiny ' + t.s], ['legend', 'Legendary ' + t.leg], ['rare', 'Rare'], ['dex', 'Full Pokédex']];
  const team = Array.from({length: 6}, (_, i) => t.team[i] ? `<button class="tm" data-id="${t.team[i]}">${img(t.team[i], t.sc[t.team[i]] > 0)}</button>` : '<div class="tm e"></div>').join('');
  const regs = REGIONS.map(r => { const have = r.ids.filter(id => t.c[id] > 0).length, done = t.badges.includes(r.n) || have >= r.ids.length;
    return `<div class="reg ${done ? 'done' : ''}"><span>${r.n}</span><div class="bar"><i style="width:${Math.round(have / r.ids.length * 100)}%"></i></div><em>${done ? 'BADGE' : have + '/' + r.ids.length}</em></div>`; }).join('');
  const meta = [`#${t.rank} all time`, t.st > 1 ? t.st + '-day streak' : '', t.last ? 'last catch ' + t.last.split('-').reverse().slice(0, 2).join('/') : ''].filter(Boolean);
  return `<a class="back" href="#/">${ICON.left}Trainers</a><div class="tgrid"><div class="side">
    <div class="card"><div class="prof">${avatar(t)}<div style="min-width:0"><h1>${esc(t.u)}</h1>${t.title ? `<span class="ttl">${esc(t.title)}</span>` : ''}<div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div></div></div>
      <div class="stats"><div class="stat"><b>${fmt(t.n)}</b><span>Caught</span></div><div class="stat"><b>${fmt(t.dex)}</b><span>Pokédex</span></div><div class="stat s"><b>${fmt(t.s)}</b><span>Shiny</span></div><div class="stat l"><b>${fmt(t.leg)}</b><span>Legends</span></div></div></div>
    <h2>Team</h2><div class="card">${t.team.length ? `<div class="team">${team}</div>` : `<div class="team">${team}</div><p class="empty">No team yet. Write F + Pokémon name in the live chat to build it.</p>`}</div>
    <h2>Regions</h2><div class="card regs">${regs}</div>
  </div><div>
    <h2>Pokémon box</h2><div class="chips" id="bf">${F.map(([k, l]) => `<button class="chip ${k === BOXSTATE.f ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="box" id="box"></div>
  </div></div>`;
}
function bindTrainer(){
  const bf = document.getElementById('bf'); if (!bf) return;
  bf.onclick = e => { const b = e.target.closest('.chip'); if (!b) return; BOXSTATE.f = b.dataset.f; BOXSTATE.p = 0; bf.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); renderBox(); };
  const t = BY[BOXSTATE.u.toLowerCase()];
  document.querySelectorAll('.tm[data-id]').forEach(s => s.onclick = () => sheet(t, +s.dataset.id, t.sc[s.dataset.id] > 0));
  renderBox();
}
function sheet(t, id, sh){
  const c = t.c[id] || 0, s = t.sc[id] || (t.sh.includes(id) ? 1 : 0), rr = rarity(id), types = (M.t[id] || '').split('/').filter(Boolean);
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const draw = () => { bg.innerHTML = `<div class="sheet"><div class="grab"></div>
    <img class="big" src="${spr(id, sh)}" onerror="sprFallback(this,${id},${sh ? 1 : 0})" alt="">
    <div class="no">${pad(id)} · ${regionOf(id)}</div><h3>${sh ? '✦ ' : ''}${esc(name(id))}</h3>
    ${rr ? `<span class="tag ${rr[0]}">${rr[1]}</span>` : ''}
    <div class="types">${types.map(x => `<span class="type" style="background:${TYPEC[x] || '#999'}">${x}</span>`).join('')}</div>
    <div class="sgrid"><div class="stat"><b>${c}</b><span>Caught</span></div><div class="stat s"><b>${s}</b><span>Shiny</span></div></div>
    ${s ? `<button class="tog" id="tog">${sh ? 'Show normal' : 'Show shiny'}</button>` : ''}</div>`;
    const tg = bg.querySelector('#tog'); if (tg) tg.onclick = e => { e.stopPropagation(); sh = !sh; draw(); }; };
  draw(); bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* ===== ROUTER ===== */
function route(){
  const app = document.getElementById('app'); if (!D) return;
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), [a, b] = [h.split('/')[0], h.split('/').slice(1).join('/')];
  document.querySelectorAll('.sheet-bg').forEach(x => x.remove());
  app.innerHTML = (a === 't' && b ? viewTrainer(b) : a === 'rank' ? viewRank(b) : a === 'hof' ? viewHof() : viewHome())
    + `<div class="foot">Fan-made page for the Live Catch community · data from the live game</div>`;
  bindSearch(); bindTrainer(); setUpd(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
async function start(){
  try { build(await load()); } catch(e){ document.getElementById('app').innerHTML = '<div class="card">Could not load data. Try again in a minute.</div>'; return; }
  route();
  setInterval(setUpd, 30000);
  if (CONFIG.SOURCE !== 'demo') setInterval(async () => { try { const d = await load(); if (d && d.t !== D.t){ build(d); if (!document.querySelector('.sheet-bg') && document.activeElement.id !== 'q') route(); else setUpd(); } } catch(e){} }, CONFIG.REFRESH_MIN * 60000);
}
start();
</script>
</body>
</html>
