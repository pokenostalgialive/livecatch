<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Catch Dex</title>
<meta name="theme-color" content="#16a99e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e3f5f3; --bg2:#dde8fb; --card:#ffffff; --ink:#1d2a3a; --mute:#6c7a8c; --line:#e3e9f0;
  --teal:#16a99e; --blue:#2f6fe0; --gold:#e8a917; --pink:#e5587e; --violet:#7a5cf0;
  --box1:#79d6c8; --box2:#6aa9ec; --slot:rgba(255,255,255,.55); --slotE:rgba(255,255,255,.22);
  --r:18px; --shadow:0 6px 22px rgba(30,60,100,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;font-size:18px}
.logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--teal),var(--blue),var(--teal));position:relative;flex:none}
.logo i:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.logo small{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:0}
.upd{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700;text-align:right}
.upd b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-right:5px;vertical-align:1px}
.tabs{display:flex;gap:4px}
.tabs a{font-weight:800;font-size:14px;color:var(--mute);text-decoration:none;padding:8px 14px;border-radius:999px}
.tabs a.on{background:var(--ink);color:#fff}
.dtabs{display:none}
.btabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.btabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-weight:800;font-size:12px;padding:6px 0;border-radius:14px}
.btabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.btabs a.on{color:var(--teal)}
.livebar{display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:25;background:linear-gradient(90deg,#e0102f,#ff2d55);color:#fff;text-decoration:none;font-weight:900;font-size:14px;padding:10px 16px;box-shadow:0 4px 14px rgba(224,16,47,.35)}
.livebar[hidden]{display:none}.livebar .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:lvdot 1.2s infinite}
.livebar em{font-style:normal;background:#fff;color:#e0102f;padding:4px 11px;border-radius:999px;font-size:12px}
@keyframes lvdot{0%,100%{opacity:1}50%{opacity:.25}}
.foot .kofi{display:inline-block;margin:10px 0 6px;background:#ff5e5b;color:#fff;font-weight:900;text-decoration:none;padding:8px 16px;border-radius:999px}
.tabs a.bt{background:linear-gradient(135deg,#ff5a5f,#ffb400);color:#fff;box-shadow:0 4px 14px rgba(255,90,95,.35)}.tabs a.bt.on{box-shadow:0 0 0 3px var(--ink)}
.btabs a.bt{color:#e63946}.btabs a.bt svg{background:linear-gradient(135deg,#ff5a5f,#ffb400);color:#fff;border-radius:50%;padding:3px;box-sizing:border-box;animation:btpulse 1.8s infinite}
@keyframes btpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,95,.55)}60%{box-shadow:0 0 0 8px rgba(255,90,95,0)}}
.bbanner{display:flex;align-items:center;gap:14px;margin-top:12px;padding:16px 18px;border-radius:22px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#e63946,#ff7a3d 55%,#ffb400);box-shadow:0 10px 26px rgba(230,57,70,.3);position:relative;overflow:hidden}
.bbanner:after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:18px solid rgba(255,255,255,.15)}
.bbanner .bi{font-size:34px;line-height:1}.bbanner b{display:block;font-size:19px;font-weight:900}.bbanner span{font-size:13px;font-weight:700;opacity:.95}
.bbanner em{margin-left:auto;font-style:normal;background:#fff;color:#e63946;font-weight:900;padding:9px 14px;border-radius:999px;white-space:nowrap;position:relative;z-index:1}
.bbanner i{position:absolute;left:14px;top:-1px;background:#fff;color:#e63946;font-style:normal;font-size:10px;font-weight:900;padding:2px 7px;border-radius:0 0 8px 8px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2{font-size:15px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:22px 4px 10px}
h2:first-child{margin-top:4px}
/* search */
.hero{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:22px;padding:20px 16px 18px;box-shadow:var(--shadow);position:relative;z-index:6}
.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at calc(100% + 0px) 0,transparent 74px,rgba(255,255,255,.12) 75px,rgba(255,255,255,.12) 100px,transparent 101px)}
.hero h1{font-size:23px;font-weight:900;line-height:1.15;position:relative}
.hero p{opacity:.9;font-weight:700;font-size:14px;margin-top:4px;position:relative}
.search{position:relative;margin-top:14px}
.search input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px 16px 14px 46px;border-radius:16px;border:0;outline:0;color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:60vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:5;color:var(--ink)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;font-weight:800}
.sugg button:not(:last-child){border-bottom:1px solid var(--line)}
.sugg small{margin-left:auto;color:var(--mute);font-weight:700}
.sugg .none{padding:14px;color:var(--mute);font-weight:700}
/* stats strip */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.today div{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center}
.today b{display:block;font-size:22px;font-weight:900}
.today span{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
/* hall of fame */
.hof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hofc.rd{background:linear-gradient(150deg,#ff4f7a,#a1206b)}
.hofc{border-radius:var(--r);padding:10px 6px;min-width:0;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:center;cursor:pointer}
.hofc.sh{background:linear-gradient(150deg,#ffb84d,#e5587e)}
.hofc.lg{background:linear-gradient(150deg,#7a5cf0,#2f6fe0)}
.hofc .lab{font-size:9.5px;font-weight:900;letter-spacing:.6px;opacity:.95;line-height:1.2;min-height:23px;display:flex;align-items:center;justify-content:center}
.hofc img{width:84px;height:84px;margin:4px auto 2px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));object-fit:contain}
.hofc .nm{font-weight:900;font-size:13px;line-height:1.15}
.hofc .by{font-size:10.5px;font-weight:700;opacity:.95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* list rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.row:not(:last-child){border-bottom:1px solid var(--line)}
.row:active{background:#f4f8fb}
.pos{width:26px;text-align:center;font-weight:900;color:var(--mute);flex:none}
.pos.p1,.pos.p2,.pos.p3{color:#fff;border-radius:50%;height:26px;line-height:26px;font-size:13px}
.pos.p1{background:#e8b923}.pos.p2{background:#a9b4c2}.pos.p3{background:#cd8a52}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11px;font-weight:800;color:var(--pink);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-weight:900;font-size:17px;text-align:right}
.val small{display:block;font-size:10px;color:var(--mute);font-weight:800;text-transform:uppercase}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:#dfe7ef;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;color:var(--mute);box-shadow:0 2px 8px rgba(30,60,100,.08)}
.chip.on{background:var(--ink);color:#fff}
/* trainer */
.tgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tgrid>div,.homeg>div{min-width:0}
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--teal)}
.prof h1{font-size:22px;font-weight:900;line-height:1.1;word-break:break-all}
.ttl{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:#fde7ee;color:var(--pink);font-size:11px;font-weight:900;letter-spacing:.5px}
.meta{font-size:13px;color:var(--mute);font-weight:800;margin-top:6px}
.meta span+span:before{content:" · "}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#f3f7fa;border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:10px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.stat.s b{color:var(--gold)}.stat.l b{color:var(--violet)}
.team{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm{aspect-ratio:1;background:#f3f7fa;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer}
.tm img{width:86%;height:86%;object-fit:contain}
.tm.e{background:repeating-linear-gradient(45deg,#f3f7fa,#f3f7fa 6px,#edf2f6 6px,#edf2f6 12px);cursor:default}
.empty{color:var(--mute);font-weight:700;font-size:13px;margin-top:8px}
.regs{display:grid;gap:8px}
.reg{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:13px;font-weight:900}
.bar{height:10px;background:#edf2f6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.reg.done .bar i{background:linear-gradient(90deg,#f2c230,#e8a917)}
.reg em{font-style:normal;text-align:right;color:var(--mute);font-weight:800;font-size:12px}
.reg.done em{color:var(--gold)}
/* box */
.box{border-radius:22px;padding:12px;background:linear-gradient(160deg,var(--box1),var(--box2));box-shadow:var(--shadow)}
.boxh{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px}
.boxh b{font-weight:900;letter-spacing:.8px;font-size:16px;background:rgba(255,255,255,.22);padding:6px 16px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.boxh button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center}
.boxh button:disabled{opacity:.35}
.boxh svg{width:20px;height:20px;color:#fff}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:14px;background:var(--slot);position:relative;display:grid;place-items:center;cursor:pointer}
.slot img{width:92%;height:92%;object-fit:contain}
.slot.shy{background:linear-gradient(150deg,rgba(255,236,170,.95),rgba(255,206,120,.75));box-shadow:inset 0 0 0 2px rgba(255,200,60,.9)}
.slot.mg{box-shadow:inset 0 0 0 2px #ff6fb5}
.slot.shy.mg{box-shadow:inset 0 0 0 2px #ff6fb5,inset 0 0 0 4px rgba(255,200,60,.9)}
.mgl{position:absolute;right:3px;top:3px;font-size:7.5px;font-weight:900;letter-spacing:.3px;background:#ff4fa3;color:#fff;border-radius:6px;padding:1px 4px;line-height:11px}
.slot.e{background:var(--slotE);cursor:default}
.slot.miss{background:var(--slotE)}
.slot.miss span{color:rgba(255,255,255,.85);font-size:10px;font-weight:900}
.slot.miss img{filter:brightness(0) opacity(.18)}
.cnt{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:900;background:#fff;color:var(--ink);border-radius:99px;padding:0 5px;line-height:15px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.star{position:absolute;left:4px;top:2px;font-size:13px;color:#ffcf3a;text-shadow:0 0 3px rgba(150,90,0,.8)}
.boxf{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.boxf i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.boxf i.on{background:#fff}
.boxnote{color:#fff;font-weight:800;font-size:13px;text-align:center;padding:30px 0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#d8e0e8;margin:0 auto 10px}
.sheet .big{width:180px;height:180px;margin:0 auto;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.sheet .no{font-weight:900;color:var(--mute);font-size:13px}
.sheet h3{font-size:24px;font-weight:900}
.types{display:flex;gap:6px;justify-content:center;margin:8px 0}
.type{padding:3px 12px;border-radius:99px;color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.6px;margin-top:4px}
.tag.mega{background:linear-gradient(90deg,#ffe0f0,#e6e0ff);color:#b0308a}.tag.legend{background:#ece6ff;color:var(--violet)}.tag.rare{background:#e3f0ff;color:var(--blue)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tog{margin-top:12px;font-weight:900;font-size:13px;padding:9px 16px;border-radius:99px;background:#fff6dc;color:#9b6c00}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.back{text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--mute);margin-bottom:10px;font-size:14px}
.back svg{width:18px;height:18px}
.foot{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin:26px 0 8px}

/* phase 2 */
.pcard{position:relative}
.partner{position:absolute;right:10px;top:8px;width:84px;height:84px;cursor:pointer}
.partner img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.prof.hasp{padding-right:80px}
.prof.hasp h1{font-size:20px}
.acts{margin-top:12px;display:flex;gap:8px}
.btn{flex:1;font-weight:900;font-size:15px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;box-shadow:0 4px 12px rgba(47,111,224,.25)}
.btn.ghost{background:#f1f5f9;color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.6}
.wish{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm.want img{opacity:.95}
.sheet .sub{color:var(--mute);font-weight:700;font-size:14px;margin:4px 0 10px}
.sheet h3+.sub b{color:var(--ink)}
.code{font-size:34px;font-weight:900;letter-spacing:2px;background:#f1f7f6;border:2px dashed var(--teal);border-radius:16px;padding:14px;margin:6px 0 12px;color:var(--ink)}
.status{font-weight:800;font-size:14px;color:var(--teal);display:flex;align-items:center;justify-content:center;gap:8px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid #cdeee9;border-top-color:var(--teal);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{font-size:12px;font-weight:700;color:#b5612a;background:#fff4ea;border-radius:12px;padding:8px 10px;margin:12px 0}
.sheet.edit{max-height:92vh;overflow:auto;text-align:center;padding-bottom:0}
.chips.ctr{justify-content:center;flex-wrap:wrap}
.chip:disabled{opacity:.4}
.hint{font-size:12px;font-weight:700;color:var(--mute);margin:6px 0;text-align:center}
.sheet .team,.sheet .wish{margin-top:6px}
.tm.rm,.pbig .rm{cursor:pointer}
.pbig{height:110px;display:grid;place-items:center;color:var(--mute);font-weight:800}
.pbig img{width:110px;height:110px;object-fit:contain}
.search.sm{margin:8px 0}
.search.sm input{font-size:15px;padding:11px 14px 11px 42px;box-shadow:none;background:#f1f5f9}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:38vh;overflow:auto;padding:2px}
.slot.pk{background:#f3f7fa;flex-direction:column;display:flex;align-items:center;justify-content:center;padding:4px 2px;aspect-ratio:auto}
.slot.pk img{width:56px;height:56px}
.slot.pk span{font-size:10px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.pk.sel{background:#dff5f1;box-shadow:inset 0 0 0 2px var(--teal)}
.savebar{position:sticky;bottom:0;background:#fff;display:flex;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:10px;border-top:1px solid var(--line)}
.sw{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#f3f7fa;border-radius:16px;padding:14px;cursor:pointer;margin-top:8px}
.sw input{display:none}
.sw>span{flex:none;width:46px;height:28px;border-radius:99px;background:#cfd8e2;position:relative;transition:.2s}
.sw>span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--teal)}
.sw input:checked+span:after{left:21px}
.sw b{display:block;font-weight:900}
.sw small{display:block;color:var(--mute);font-weight:700;font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:12px 18px;border-radius:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s;max-width:90vw;text-align:center}
.mepill{display:inline-block;margin-left:8px;background:#e3f6f3;color:var(--teal);font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px;text-decoration:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.foot a{color:var(--mute);font-weight:800}
.legal h1{font-size:24px;font-weight:900}
.legal h4{margin:16px 0 4px;font-weight:900;font-size:15px}
.legal p{font-size:14px;font-weight:600;line-height:1.5;color:#3a4757}
@media(max-width:420px){.logo{white-space:nowrap;font-size:17px}.logo small{display:none}.mepill{max-width:140px!important}.upd{font-size:11px}.mepill{display:block;margin:3px 0 0 auto;max-width:120px}}
@media(min-width:860px){
  .hofc img{width:104px;height:104px}.hofc .nm{font-size:15px}.hofc .lab{font-size:11px}.toast{bottom:30px}}
.goal+.goal{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.goalh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

    return {u, n: d.n || 0, s: d.s || 0, c, sc: d.sc || {}, sh: (d.sh || []).map(Number), own, mega, forms, mg: mega.length, dex: own.length, leg: own.filter(id => LEG.has(id)).length + forms.length,
      team: (d.team || []).filter(id => M.n[id] || ALT[id]), st: d.st || 0, last: d.last, title: (d.skins && d.skins.ghost) ? 'GHOST MASTER' : d.title || null, skins: d.skins || {}, lwish: (d.wish || []).map(Number), hw: d.hw || 0, hwr: d.hwr || 0, stones: d.stones || 0, badges: d.badges || [], av: av[u] || null, wk: wk[u] || 0};
  });

/* trainer + box */
let BOXSTATE = {u: null, f: 'caught', p: 0};
const shN = (t, id) => Math.min(t.c[id] || 0, t.sc[id] !== undefined ? +t.sc[id] || 0 : t.sh.includes(+id) ? 1 : 0);      // shiny copies (included in c)
const nrN = (t, id) => Math.max(0, (t.c[id] || 0) - shN(t, id));      // normal copies
function boxList(t, f){
  if (f === 'dex') return IDS.map(id => ({id, has: t.c[id] > 0, sh: t.c[id] > 0 && !nrN(t, id), cnt: 0}));
  const base = id => isAlt(id) ? ALT[id][1] : id;      // family = base Pokémon: Charizard, Charizard shiny, Mega X, Mega Y...
  let ids = f === 'mega' ? MEGAIDS.slice().sort((a, b) => base(a) - base(b) || a - b) : t.own.concat(t.mega, t.forms).sort((a, b) => base(a) - base(b) || a - b);
  if (f === 'legend') ids = ids.filter(id => isForm(id) || LEG.has(base(id)) || UB.has(base(id)));
  if (f === 'rare') ids = ids.filter(id => RARE.has(base(id)));
  const out = [];
  for (const id of ids){ const n = nrN(t, id), sh = shN(t, id);
    if (f === 'mega' && !(t.c[id] > 0)){ out.push({id, has: false}); continue; }
    if (f !== 'shiny' && n) out.push({id, has: true, sh: false, cnt: n});
    if (sh) out.push({id, has: true, sh: true, cnt: sh}); }      // shiny in its own slot, right after the normal one
  return out;
}
function regionOf(id){ const r = REGIONS.find(r => id >= r.ids[0] && id <= r.ids[r.ids.length - 1]); return r ? r.n : ''; }
function renderBox(){
  const t = BY[BOXSTATE.u.toLowerCase()], L = boxList(t, BOXSTATE.f), pages = Math.max(1, Math.ceil(L.length / 30));
  BOXSTATE.p = Math.min(Math.max(0, BOXSTATE.p), pages - 1);
  const items = L.slice(BOXSTATE.p * 30, BOXSTATE.p * 30 + 30), el = document.getElementById('box');
  const label = BOXSTATE.f === 'dex' && items.length ? regionOf(items[0].id) + ' · ' + (BOXSTATE.p + 1) : BOXSTATE.f === 'mega' ? 'MEGA · ' + (BOXSTATE.p + 1) : 'BOX ' + (BOXSTATE.p + 1);
  let slots = items.map(x => {
    if (!x.has) return isMega(x.id) ? `<div class="slot miss" title="${esc(name(x.id))}">${img(x.id, false)}</div>` : `<div class="slot miss" data-id="${x.id}"><span>${String(x.id).padStart(4, '0')}</span></div>`;
    return `<button class="slot ${x.sh ? 'shy' : ''} ${isMega(x.id) ? 'mg' : ''}" data-id="${x.id}" data-sh="${x.sh ? 1 : 0}">${img(x.id, x.sh)}${x.sh ? '<span class="star">✦</span>' : ''}${isMega(x.id) ? '<span class="mgl">MEGA</span>' : ''}${x.cnt > 1 ? `<span class="cnt">x${x.cnt}</span>` : ''}</button>`;
  }).join('');
  for (let i = items.length; i < 30; i++) slots += '<div class="slot e"></div>';
  const dots = pages <= 14 ? Array.from({length: pages}, (_, i) => `<i class="${i === BOXSTATE.p ? 'on' : ''}"></i>`).join('') : `<span style="color:#fff;font-weight:900;font-size:12px">${BOXSTATE.p + 1} / ${pages}</span>`;
  el.innerHTML = `<div class="boxh"><button id="bp" ${BOXSTATE.p ? '' : 'disabled'} aria-label="Previous box">${ICON.left}</button><b>${label}</b><button id="bn" ${BOXSTATE.p < pages - 1 ? '' : 'disabled'} aria-label="Next box">${ICON.right}</button></div>
    ${L.length ? `<div class="slots">${slots}</div>` : `<div class="boxnote">Nothing here yet</div>`}<div class="boxf">${dots}</div>`;
  el.querySelector('#bp').onclick = () => { BOXSTATE.p--; renderBox(); };
  el.querySelector('#bn').onclick = () => { BOXSTATE.p++; renderBox(); };
  el.querySelectorAll('.slot[data-id]').forEach(s => s.onclick = () => sheet(t, +s.dataset.id, s.dataset.sh === '1'));

    if (Math.abs(dx) > 60){ BOXSTATE.p += dx < 0 ? 1 : -1; renderBox(); } };
}

async function rpc(fn, body){
  if (DEMO) return demoRpc(fn, body);

  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}

function demoRpc(fn, b){      // ?demo only: fakes the server (verification completes by itself after 4 s)
  if (/trade/.test(fn)) return demoTrades(fn, b);
  if (/battle|champions/.test(fn)) return demoBattle(fn, b);

  if (fn === 'evolve_mon') return b.p_to;

function bnext(el){ const L = JSON.parse(el.dataset.l), i = +el.dataset.i + 1; if (i < L.length){ el.dataset.i = i; el.src = L[i]; return; }
  el.onerror = null; el.onload = null; const [id, sh, back] = el.dataset.k.split('-').map(Number); el.className = 'home' + (back ? ' flip' : '') + fxc(id); el.style.width = el.style.height = ''; el.src = spr(id, sh); }
const bimg = (id, sh, back) => { const L = bsrcs(id, sh, back); return `<img alt="" class="${fxc(id).trim()}" data-k="${id}-${sh ? 1 : 0}-${back ? 1 : 0}" data-i="0" data-l='${JSON.stringify(L)}' src="${L[0]}" onload="bsz(this)" onerror="bnext(this)">`; };
async function runBattle(opp, mine, onEnd){
  const foes = opp.mons || opp.team.map(id => mkMon(id, 100, defMoves(id), false));
  let a = 0, f = 0; const P = mine, F = foes;
  const ov = document.createElement('div'); ov.className = 'bov'; ov.style.setProperty('--tc', opp.color || '#5fb3e6'); document.body.appendChild(ov);
  const hpbar = m => { const p = Math.max(0, m.hp / m.maxhp * 100); return `<div class="hpb"><i style="width:${p}%;background:${p > 50 ? '#3cc46d' : p > 20 ? '#f2b630' : '#e5484d'}"></i></div><small>${Math.max(0, m.hp)}/${m.maxhp}</small>`; };
  const dots = (arr, cur) => arr.map((m, i) => `<i class="${m.hp <= 0 ? 'ko' : i === cur ? 'cur' : ''}"></i>`).join('');
  let log = '', busy = false;
  const render = (mode = 'moves') => {
    const pm = P[a], fm = F[f], keep = [ov.querySelector('#sprF img'), ov.querySelector('#sprP img')];
    ov.innerHTML = `<div class="bbg"><i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i><i class="spk s1"></i><i class="spk s2"></i><i class="spk s3"></i><i class="spk s4"></i></div><div class="bfield">
      <div class="btop"><button class="bx" id="bquit">✕</button><b>${esc(opp.n)}</b><span class="bdots">${dots(F, f)}</span></div>
      <div class="bfoe"><div class="binfo"><b>${fm.sh ? '✦ ' : ''}${esc(name(fm.id))}</b><span>Lv ${fm.lv}</span>${hpbar(fm)}</div><div class="bspr foe" id="sprF">${bimg(fm.id, fm.sh, false)}</div></div>
      <div class="bme"><div class="bspr me" id="sprP">${bimg(pm.id, pm.sh, true)}</div><div class="binfo"><b>${pm.sh ? '✦ ' : ''}${esc(name(pm.id))}</b><span>Lv ${pm.lv}</span>${hpbar(pm)}<span class="bdots">${dots(P, a)}</span></div></div>
      <div class="blog">${log}</div>
      <div class="bctl">${mode === 'moves' ? pm.mv.map((x, i) => { const m = MV(x.id); return `<button class="bmv" data-i="${i}" style="--c:${TYPEC[m[1]] || '#999'}" ${busy || (m[6] === 'heal' && x.heals <= 0) ? 'disabled' : ''}><b>${esc(m[0])}</b><small>${m[6] === 'protect' ? 'PROTECT' : m[6] === 'heal' ? 'HEAL · ' + x.heals + ' left' : m[1].toUpperCase() + ' · ' + m[2]}</small></button>`; }).join('') + `<button class="bmv sw" id="bsw" ${busy || P.filter(m => m.hp > 0).length < 2 ? 'disabled' : ''}><b>Switch</b><small>change Pokémon</small></button>`
        : mode === 'switch' || mode === 'force' ? P.map((m, i) => `<button class="bmv sw2" data-s="${i}" ${m.hp <= 0 || i === a ? 'disabled' : ''}>${img(m.id, m.sh)}<b>${esc(name(m.id))}</b><small>${m.hp <= 0 ? 'KO' : m.hp + '/' + m.maxhp}</small></button>`).join('') + (mode === 'switch' ? '<button class="bmv sw" id="bback"><b>Back</b></button>' : '')
        : `<button class="bmv" id="bend" style="grid-column:1/-1"><b>${mode}</b></button>`}</div></div>`;
    ['#sprF img', '#sprP img'].forEach((q, i) => { const n = ov.querySelector(q), o = keep[i]; if (n && o && n.dataset.k === o.dataset.k) n.replaceWith(o); });      // same Pokémon: keep the running animation
    ov.querySelector('#bquit').onclick = () => { if (confirmQuit()){ ov.remove(); if (onEnd && !ended){ ended = true; onEnd(false); } } };
    ov.querySelectorAll('.bmv[data-i]').forEach(b => b.onclick = () => turn({k: 'move', i: +b.dataset.i}));
    const sw = ov.querySelector('#bsw'); if (sw) sw.onclick = () => render('switch');
    const bk = ov.querySelector('#bback'); if (bk) bk.onclick = () => render('moves');
    ov.querySelectorAll('.bmv[data-s]').forEach(b => b.onclick = () => mode === 'force' ? forceSwitch(+b.dataset.s) : turn({k: 'switch', s: +b.dataset.s}));
    const be = ov.querySelector('#bend'); if (be) be.onclick = () => { ov.remove(); if (onEnd) onEnd(result); else route(); };
  };
  let ended = false, result = false, quitArm = 0; const confirmQuit = () => { if (Date.now() - quitArm < 2500) return true; quitArm = Date.now(); toast('Tap ✕ again to leave the battle'); return false; };
  const say = async (t, ms = 900) => { log = t; render('moves'); await sleep(ms); };
  const hit = async (side) => { const el = ov.querySelector(side === 'F' ? '#sprF' : '#sprP'); if (el){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } await sleep(350); };
  async function doMove(user, target, mi, uSide){
    const x = user.mv[mi], m = MV(x.id), who = (uSide === 'P' ? '' : 'Foe ') + name(user.id);
    if (m[6] === 'protect'){ const ok = !user.lastProt || Math.random() < 1 / 3; user.prot = ok; user.lastProt = ok; await say(ok ? `${who} protected itself!` : `${who} used ${m[0]}... but it failed!`); return; }
    user.lastProt = false;
    if (m[6] === 'heal'){ x.heals--; const h = Math.min(user.maxhp - user.hp, Math.floor(user.maxhp / 2)); user.hp += h; await say(`${who} used ${m[0]} and restored ${h} HP!`); return; }
    await say(`${who} used ${m[0]}!`, 650);
    if (target.prot){ await say(`${(uSide === 'P' ? 'Foe ' : '') + name(target.id)} protected itself!`); return; }
    if (m[3] && Math.random() * 100 >= m[3]){ await say('The attack missed!'); return; }
    const r = calcDmg(user, target, m);
    if (r.eff === 0){ await say(`It doesn't affect ${name(target.id)}...`); return; }
    target.hp = Math.max(0, target.hp - r.dmg); await hit(uSide === 'P' ? 'F' : 'P');
    const notes = [r.crit ? 'A critical hit!' : '', r.eff > 1 ? "It's super effective!" : r.eff < 1 ? "It's not very effective..." : ''].filter(Boolean).join(' ');
    await say(notes || `${r.dmg} damage!`, notes ? 900 : 500);
    if (target.hp <= 0) await say(`${(uSide === 'P' ? 'Foe ' : '') + name(target.id)} fainted!`);
  }
  async function turn(act){
    if (busy) return; busy = true;
    const pm = P[a], fm = F[f], fi = botPick(fm, pm, opp.rnd); pm.prot = false; fm.prot = false;
    if (act.k === 'switch'){ a = act.s; pm.lastProt = false; await say(`Come back, ${name(pm.id)}! Go, ${name(P[a].id)}!`); await doMove(fm, P[a], fi, 'F'); }
    else {
      const pmv = MV(pm.mv[act.i].id), fmv = MV(fm.mv[fi].id);
      const pFirst = pmv[5] !== fmv[5] ? pmv[5] > fmv[5] : pm.spe !== fm.spe ? pm.spe > fm.spe : Math.random() < 0.5;
      const order = pFirst ? [[pm, fm, act.i, 'P'], [fm, pm, fi, 'F']] : [[fm, pm, fi, 'F'], [pm, fm, act.i, 'P']];
      for (const [u, t, i, s] of order){ if (u.hp <= 0 || t.hp <= 0) continue; await doMove(u, t, i, s); }
    }
    busy = false; await after();
  }
  async function after(){
    if (F[f].hp <= 0){ const nx = F.findIndex(m => m.hp > 0); if (nx < 0) return win(); f = nx; await say(`${opp.n} sent out ${name(F[f].id)}!`); }
    if (P[a].hp <= 0){ if (!P.some(m => m.hp > 0)) return lose(); log = 'Choose your next Pokémon'; render('force'); return; }
    log = `What will ${name(P[a].id)} do?`; render('moves');
  }
  async function forceSwitch(s){ a = s; await say(`Go, ${name(P[a].id)}!`, 700); log = `What will ${name(P[a].id)} do?`; render('moves'); }
  async function win(){
    busy = true; ended = true; result = true; let msg = `You defeated ${opp.n}!`;
    try { const r = await rpc('battle_win', {p_token: AUTH.token, p_kind: opp.kind, p_gym: opp.gym !== undefined ? opp.gym + 1 : 0, p_league: (opp.league || 0) + 1, p_team: opp.kind === 'champ' ? opp.snap : null});
      if (r){ const nb = r.badges > BPROG.badges; BPROG = r; if (CHAMPS !== undefined && r.became){ await loadBattle(); }
        if (nb) msg += ` You earned the ${LEAGUES[opp.league].gyms[opp.gym].b}! Reward: an Ultra Ball in the next live.`;
        if (opp.kind === 'elite') msg += opp.gym < 3 ? ` Next: ${LEAGUES[opp.league].elite[opp.gym + 1].n}.` : ' Now the Champion awaits!';
        if (r.became) msg += ` You are the new ${LEAGUES[opp.league].n} Champion! Your team stays here to defend the title.`;
        if (r.reward === 'master') msg += ' Reward: a Master Ball in the next live!'; } } catch(e){ if (opp.kind === 'champ') msg += ' (' + e.message + ')'; }
    log = msg; busy = false; render('Continue');
  }
  async function lose(){ ended = true; result = false; log = opp.kind === 'elite' ? 'All your Pokémon fainted... The Elite Four run starts over.' : opp.kind === 'champ' ? `${opp.n} defended the title!` : 'All your Pokémon fainted... Try again with another team!'; busy = false; render('Continue');
    if (opp.kind === 'champ'){ try { await rpc('battle_lose', {p_token: AUTH.token, p_kind: 'champ', p_league: opp.league + 1}); } catch(e){} } }
  log = `${opp.n} wants to battle! ${opp.n} sent out ${name(F[0].id)}!`; render('moves');
}
const demoCh = [{league: 1, u: 'giulia_shinyhunt', team: [{id: 448, sh: false, lv: 100, mv: [370, 396, 182, 430]}, {id: 445, sh: false, lv: 100}, {id: 6, sh: true, lv: 100}], since: '2026-10-27T10:00:00Z', wins: 2}];
function demoBattle(fn, b){
  if (fn === 'my_battle') return BPROG;
  if (fn === 'champions') return demoCh;
  if (fn === 'battle_lose') return null;
  if (fn === 'battle_win'){ const r = Object.assign({champs: []}, BPROG); r.wins++; const li = b.p_league - 1;
    if (b.p_kind === 'gym' && li === r.cleared && b.p_gym === r.badges - li * 8 + 1) r.badges++;
    if (b.p_kind === 'elite'){ r.elite = b.p_gym; r.elite_league = b.p_league; }
    if (b.p_kind === 'champ'){ r.elite = 0; r.cleared = Math.max(r.cleared, b.p_league); r.champs = [...new Set(r.champs.concat(b.p_league))]; r.became = true; if (!r.mb){ r.mb = true; r.reward = 'master'; }
      const i = demoCh.findIndex(c => c.league === b.p_league); const c = {league: b.p_league, u: ME.u, team: b.p_team, since: new Date().toISOString(), wins: 0}; if (i >= 0) demoCh[i] = c; else demoCh.push(c); }
    return r; }
  if (fn === 'battle_board') return [{u: 'pkmn.luca', badges: 5, wins: 41, cleared: 0, champs: 0}, {u: 'giulia_shinyhunt', badges: 8, wins: 22, cleared: 1, champs: 1}];
  return null;
}

/* ===== TEAM + EVOLUTIONS from HOME (applied by the game when it opens, like trades) ===== */
const EVO = M.evo || {};
let EVO_ALL = false;
const canEvo = (t, id) => !!EVO[id] && (t.c[id] || 0) >= 3;
function evoHtml(t){
  if (!isMe(t.u)) return '';
  const L = Object.keys(t.c).map(Number).filter(id => canEvo(t, id)).sort((a, b) => a - b);
  if (!L.length) return '';
  return `<h2>Ready to evolve</h2><div class="card evos">${L.slice(0, EVO_ALL ? 60 : 4).map(id => `<div class="evr"><span class="trm">${img(id, false)}</span><span class="evinfo"><b>${esc(name(id))} x${t.c[id]}</b><small>uses 2, you keep ${t.c[id] - 2}</small></span><span class="evb">${EVO[id].filter(x => M.n[x]).map(x => `<button class="mini" data-evo="${id}" data-to="${x}">→ ${esc(name(x))}</button>`).join('')}</span></div>`).join('')}
    ${L.length > 4 && !EVO_ALL ? `<button class="btn ghost" id="evoall" style="width:100%;margin-top:8px">Show all ${L.length}</button>` : ''}<button class="btn" id="evomany" style="width:100%;margin-top:8px">Evolve many at once</button><p class="hint" style="text-align:left">Like EV in the live: 3 of the same Pokémon, 2 are used (normal ones first).</p></div>`;
}
async function doEvolve(base, to, btn){
  if (btn) btn.disabled = true;
  try { await rpc('evolve_mon', {p_token: AUTH.token, p_base: base, p_to: to}); if (!DEMO) build(await load()); else demoEvo(base, to);
    toast(`${name(base)} evolved into ${name(to)}!`); route(); }
  catch(e){ toast(e.message); if (btn) btn.disabled = false; }
}
function demoEvo(base, to){ const t = BY[ME.u.toLowerCase()]; t.c[base] -= 2; t.c[to] = (t.c[to] || 0) + 1; if (!t.own.includes(to)) t.own.push(to); t.dex = t.own.filter(id => t.c[id] > 0).length; }
// evolve many at once: every evolution still needs 3 of the same and uses 2 (you always keep at least 1)
function openBulkEvo(){
  const me = BY[ME.u.toLowerCase()];
  const L = Object.keys(me.c).map(Number).filter(id => canEvo(me, id)).sort((a, b) => a - b);
  const maxOf = id => Math.floor(((me.c[id] || 0) - 1) / 2);
  const st = {}; L.forEach(id => st[id] = {n: 0, t: EVO[id].filter(x => M.n[x])[0]});
  const bg = openSheet('', 'edit'), sh = bg.querySelector('.sheet');
  const draw = () => { const tot = L.reduce((s, id) => s + st[id].n, 0);
    sh.innerHTML = `<div class="grab"></div><h3>Evolve many</h3><p class="sub">Each evolution uses 2 of the same Pokémon. You always keep at least 1. Max 60 at once.</p>
      <div class="savebar" style="position:static;border:0;padding:0 0 8px"><button class="btn ghost" id="none">None</button><button class="btn ghost" id="all">Max all</button></div>
      <div class="bulk">${L.map(id => { const s = st[id], opts = EVO[id].filter(x => M.n[x]);
        return `<div class="bkr"><span class="trm">${img(id, false)}</span><span class="evinfo"><b>${esc(name(id))} x${me.c[id]}</b>
          ${opts.length > 1 ? `<select data-t="${id}">${opts.map(x => `<option value="${x}" ${x === s.t ? 'selected' : ''}>→ ${esc(name(x))}</option>`).join('')}</select>` : `<small>→ ${esc(name(s.t))}</small>`}</span>
          <span class="step"><button data-m="${id}">−</button><b>${s.n}</b><button data-p="${id}">+</button></span></div>`; }).join('')}</div>
      <div class="savebar"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="go" ${tot ? '' : 'disabled'}>Evolve ${tot}</button></div>`;
    sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const id = +b.dataset.p; if (tot >= 60) return toast('Max 60 evolutions at once'); if (st[id].n < maxOf(id)) st[id].n++; draw(); });
    sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const id = +b.dataset.m; if (st[id].n > 0) st[id].n--; draw(); });
    sh.querySelectorAll('[data-t]').forEach(x => x.onchange = () => { st[+x.dataset.t].t = +x.value; });
    sh.querySelector('#all').onclick = () => { let left = 60; L.forEach(id => { st[id].n = Math.min(maxOf(id), left); left -= st[id].n; }); draw(); };
    sh.querySelector('#none').onclick = () => { L.forEach(id => st[id].n = 0); draw(); };
    sh.querySelector('#cancel').onclick = bg.close;
    sh.querySelector('#go').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Evolving...';
      const items = L.filter(id => st[id].n > 0).map(id => ({b: id, t: st[id].t, n: st[id].n}));
      try { const n = await rpc('evolve_bulk', {p_token: AUTH.token, p_items: items});
        if (DEMO) items.forEach(x => { for (let i = 0; i < x.n; i++) demoEvo(x.b, x.t); }); else build(await load());
        bg.close(); toast(`${n} evolutions done!`); route(); }
      catch(err){ e.target.disabled = false; e.target.textContent = 'Evolve ' + tot; toast(err.message); } };
  };
  draw();
}
function openTeam(){
  const me = BY[ME.u.toLowerCase()], own = me.own.concat(me.mega, me.forms);
  const st = {sel: me.team.filter(id => me.c[id] > 0).slice(0, 6), q: ''};
  const bg = openSheet('', 'edit'), sh = bg.querySelector('.sheet');
  const draw = () => { const q = st.q.trim().toLowerCase(), list = own.filter(id => !q || name(id).toLowerCase().includes(q)).sort((a, b) => (me.c[b] || 0) - (me.c[a] || 0)).slice(0, 150);
    sh.innerHTML = `<div class="grab"></div><h3>Your team</h3><p class="sub">${st.sel.length}/6 · tap to remove</p>
      <div class="team">${Array.from({length: 6}, (_, i) => st.sel[i] ? `<button class="tm rm" data-rm="${st.sel[i]}">${img(st.sel[i], shN(me, st.sel[i]) > 0)}</button>` : '<div class="tm e"></div>').join('')}</div>
      <div class="search sm">${ICON.home}<input id="pq" type="search" placeholder="Search your Pokémon" value="${esc(st.q)}" autocomplete="off"></div>
      <div class="picker">${list.map(id => `<button class="slot pk ${st.sel.includes(id) ? 'sel' : ''} ${isMega(id) ? 'mg' : ''}" data-id="${id}">${img(id, false)}<span>${esc(name(id))}</span></button>`).join('')}</div>
      <div class="savebar"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save team</button></div>`;
    sh.querySelectorAll('.pk').forEach(b => b.onclick = () => { const id = +b.dataset.id; if (st.sel.includes(id)) st.sel = st.sel.filter(x => x !== id); else if (st.sel.length < 6) st.sel.push(id); else return toast('Max 6 Pokémon'); draw(); });
    sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { st.sel = st.sel.filter(x => x !== +b.dataset.rm); draw(); });
    const pq = sh.querySelector('#pq'); pq.oninput = () => { st.q = pq.value; const p = pq.selectionStart; draw(); const n = sh.querySelector('#pq'); n.focus(); n.setSelectionRange(p, p); };
    sh.querySelector('#cancel').onclick = bg.close;
    sh.querySelector('#save').onclick = async e => { e.target.disabled = true;
      try { const t = await rpc('set_team', {p_token: AUTH.token, p_team: st.sel}); if (DEMO) me.team = st.sel.slice(); else build(await load()); bg.close(); toast('Team saved! It updates in the live game too.'); route(); }
      catch(err){ e.target.disabled = false; toast(err.message); } };
  };
  draw();
}

/* ===== ROUTER ===== */
function route(){
  const app = document.getElementById('app'); if (!D) return;
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), [a, b] = [h.split('/')[0], h.split('/').slice(1).join('/')];
  document.querySelectorAll('.sheet-bg').forEach(x => x.remove());
  app.innerHTML = (a === 't' && b ? viewTrainer(b) : a === 'rank' ? viewRank(b) : a === 'hof' ? viewHof() : a === 'privacy' ? viewPrivacy() : a === 'battle' ? viewBattle() : viewHome())
    + `<div class="foot">Fan-made page for the Live Catch community. Not affiliated with Nintendo, The Pokémon Company or Game Freak.<br>${CONFIG.KOFI ? `<a class="kofi" href="${CONFIG.KOFI}" target="_blank" rel="noopener">☕ Support the project</a><br>` : ''}<a href="#/privacy">Privacy</a></div>`;
  bindSearch(); bindTrainer(); setUpd(); window.scrollTo(0, 0);
  if (a === 'hof') recentHtml();
  if (a === 'battle') bindBattle();
}
window.addEventListener('hashchange', route);
async function start(){
  try { const [d] = await Promise.all([load(), loadProfiles(), loadMe()]); build(d); await Promise.all([loadTrades(), loadBattle(), loadBoard()]); } catch(e){ document.getElementById('app').innerHTML = '<div class="card">Could not load data. Try again in a minute.</div>'; return; }
  route();
  const pend = LS.get('lch_pending', null); if (pend && Date.now() < pend.until && !AUTH) pollClaim(pend.u, null);
  setInterval(setUpd, 30000);
  if (!DEMO) setInterval(async () => { try { const [d] = await Promise.all([load(), loadProfiles()]); if (d && d.t !== D.t){ build(d); if (!document.querySelector('.sheet-bg') && document.activeElement.id !== 'q') route(); else setUpd(); } } catch(e){} }, CONFIG.REFRESH_MIN * 60000);
}
start();
